<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sol Fitness">
  <meta name="description" content="Tu app de entrenamiento y nutrición personalizada">

  <title>Sol Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">

  <!-- Chart.js para gráficas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Contenido dinámico -->
    <main id="view-container">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;">
        <div style="text-align:center;color:#6c63ff;">
          <div style="font-size:48px;margin-bottom:16px;">💪</div>
          <p style="font-size:16px;font-weight:600;">Cargando...</p>
        </div>
      </div>
    </main>

    <!-- Navegación inferior -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="hoy">
        <span class="nav-icon">🏠</span>
        <span>Hoy</span>
      </button>
      <button class="nav-btn" data-view="progreso">
        <span class="nav-icon">📈</span>
        <span>Progreso</span>
      </button>
      <button class="nav-btn" data-view="historial">
        <span class="nav-icon">📋</span>
        <span>Historial</span>
      </button>
      <button class="nav-btn" data-view="nutricion">
        <span class="nav-icon">🥗</span>
        <span>Nutrición</span>
      </button>
      <button class="nav-btn" data-view="ajustes">
        <span class="nav-icon">⚙️</span>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <!-- Scripts (orden importante) -->
  <script src="js/data.js"></script>
  <script src="js/nutrition-config.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/store.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
