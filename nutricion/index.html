/* Palabras que no identifican producto: conectores y formas de venta o
   corte. Se consumen al leer, pero no se usan para buscar. */
const STOPWORDS = ['de','del','la','el','los','las','unos','unas',
                   'y','e','mas','tambien','con','para','al','me','he','comprado'];
const RELLENOS = ['lomo','filete','rodaja','trozo','pieza','bandeja','paquete',
                  'bolsa','bote','lata','tarrina','malla','manojo','unidad',
                  'fresco','fresca','congelado','congelada','natural','entero','entera'];
const UNIDAD_RE = /^(kg|kilos?|kilogramos?|gramos?|grs?|g|litros?|lts?|l|mililitros?|ml|unidades?|uds?|ud|docenas?|paquetes?|botes?|latas?|bolsas?|bandejas?|barras?|piezas?)$/;

function esStop(w) { return STOPWORDS.indexOf(w) >= 0; }
function esRelleno(w) { return RELLENOS.indexOf(stem(w)) >= 0; }
function esContenido(w) { return !!w && w.length >= 2 && !esStop(w) && !esRelleno(w) && !UNIDAD_RE.test(w); }

/* Traduce cantidad y unidad a gramos o mililitros. */
function gramosDe(cantidad, unidad, food) {
  const esPeso = /^(kg|kilo|gramo|gr|g)/.test(unidad || '');
  const esVol  = /^(litro|lt|l$|mililitro|ml)/.test(unidad || '');
  const esUd   = /^(unidad|ud|docena|paquete|bote|lata|bolsa|bandeja|barra|pieza)/.test(unidad || '');
  if (cantidad != null && esPeso) return /^(kg|kilo)/.test(unidad) ? cantidad * 1000 : cantidad;
  if (cantidad != null && esVol)  return /^(litro|lt|l$)/.test(unidad) ? cantidad * 1000 : cantidad;
  if (cantidad != null && esUd) {
    if (/^(paquete|bote|lata|bolsa|bandeja|barra)/.test(unidad)) return cantidad * defaultPurchase(food);
    const uds = /^docena/.test(unidad) ? cantidad * 12 : cantidad;
    return uds * (food && food.peso_ud_g ? food.peso_ud_g : defaultPurchase(food) / 6);
  }
  if (cantidad != null) {
    return cantidad * (food && food.peso_ud_g ? food.peso_ud_g : (food ? defaultPurchase(food) / 4 : 125));
  }
  return defaultPurchase(food);
}

/**
 * Reconoce los productos de una frase corrida.
 *
 * Al dictar en español no salen comas: "almejas lomos de bacalao lomos de
 * salmón y gambas" llega de una pieza. Así que no se puede trocear por
 * puntuación; hay que ir leyendo y reconociendo productos del catálogo.
 *
 * Se toma en cada punto la secuencia MÁS LARGA que case con un alimento,
 * con una regla que evita comerse el principio del siguiente: la ventana
 * no puede terminar en conector ni en palabra de formato. Así "almejas
 * lomos" no se acepta y "lomos de bacalao" queda entero para el bacalao.
 */
function scanShopping(texto) {
  const orig = String(texto || '').trim().split(/\s+/).filter(Boolean);
  const toks = orig.map(t => {
    const w = norm(t).replace(/[^a-z0-9.,%]/g, '');
    return (w === 'cero' || w === 'zero') ? '0' : w;   // al dictar, "cero" es el 0%
  });
  const out = [];
  const MAXW = 6;
  let i = 0;

  while (i < toks.length) {
    if (!toks[i] || esStop(toks[i])) { i++; continue; }

    // ---- cantidad y unidad, si las hay ----
    let cantidad = null, unidad = null, j = i;
    const m = toks[j].match(/^(\d+(?:[.,]\d+)?)$/);
    if (m) { cantidad = parseFloat(m[1].replace(',', '.')); j++; }
    else if (NUM_PALABRA[toks[j]] != null) { cantidad = NUM_PALABRA[toks[j]]; j++; }
    if (cantidad === 0) cantidad = null;   // el "0" de "yogur 0%" no es cantidad
    if (j < toks.length && UNIDAD_RE.test(toks[j])) { unidad = toks[j]; j++; }
    while (j < toks.length && esStop(toks[j])) j++;

    // ---- producto: la ventana más larga que case ----
    let mejor = null;
    const tope = Math.min(MAXW, toks.length - j);
    for (let L = tope; L >= 1; L--) {
      if (!esContenido(toks[j + L - 1])) continue;   // no acabar en relleno ni conector
      const sig = toks.slice(j, j + L).filter(esContenido);
      if (!sig.length) continue;
      const cand = searchFoods(sig.join(' '), 4);
      if (cand.length) { mejor = { food: cand[0], alt: cand, fin: j + L }; break; }
    }

    if (!mejor) {
      // No se reconoce nada aquí: se guarda para que se pueda corregir
      const fin = Math.min(toks.length, j + 1);
      out.push({ raw: orig.slice(i, fin).join(' '), texto: toks.slice(i, fin).join(' '),
                 food: null, candidatos: [], gramos: 0, seguro: false });
      i = fin;
      continue;
    }

    // "huevo entero": "entero" es relleno, pero está en el nombre del
    // producto, así que se lo queda. "almejas lomos" no, porque "lomo" no
    // aparece en Almejas y pertenece al siguiente producto.
    let fin = mejor.fin;
    const nombreRaiz = stemmedName(mejor.food);
    while (fin < toks.length &&
           (esRelleno(toks[fin]) || /^\d{1,2}%?$/.test(toks[fin])) &&
           nombreRaiz.indexOf(stem(toks[fin])) >= 0) fin++;

    out.push({
      raw: orig.slice(i, fin).join(' '),
      texto: toks.slice(j, fin).join(' '),
      food: mejor.food,
      candidatos: mejor.alt,
      gramos: Math.max(1, Math.round(gramosDe(cantidad, unidad, mejor.food))),
      seguro: true,
    });
    i = fin;
  }
  return out;
}

/**
 * Punto de entrada. Se trocea por saltos de línea y signos cuando los hay
 * (archivos y tickets vienen así), y cada trozo se escanea, porque dentro
 * de un mismo trozo puede haber varios productos seguidos.
 */
function parseShoppingText(texto) {
  return String(texto || '')
    .split(/\r?\n|;|\.|,/)
    .map(t => t.replace(/^[-*•·]+\s*/, '').replace(/^\d+[.)]\s+/, ''))
    .filter(t => t.trim())
    .reduce((acc, trozo) => acc.concat(scanShopping(trozo)), []);
}

/* ---- Consumo y reposición ---- */

/** Gramos al día de un alimento, mirando lo registrado los últimos días. */
function consumptionRate(foodId, dias) {
  const n = dias || 21;
  let total = 0, diasConDatos = 0;
  for (let i = 0; i < n; i++) {
    const f = shiftDate(today(), -i);
    const log = dayLog(f);
    if (!log.entries.length) continue;
    diasConDatos++;
    log.entries.forEach(e => { if (e.food_id === foodId) total += (e.qty || 0); });
  }
  if (!diasConDatos) return 0;
  return total / diasConDatos;
}

/**
 * Estado de la despensa: cuánto queda de cada cosa y para cuántos días,
 * según lo que se consume de verdad. Es lo que convierte la lista de la
 * compra en algo que se adelanta en vez de ir a remolque.
 */
function pantryStatus(diasAviso) {
  const umbral = diasAviso || 5;
  return pantry().map(p => {
    const f = foodById(p.ingredient_id);
    if (!f) return null;
    const ritmo = consumptionRate(p.ingredient_id);
    const quedan = p.estimated_quantity || 0;
    const dias = ritmo > 0 ? quedan / ritmo : null;
    return {
      food: f, cantidad: quedan, ritmo: ritmo,
      dias: dias == null ? null : Math.floor(dias),
      seAcaba: quedan <= 0 || (dias != null && dias <= umbral),
      sinDatos: ritmo === 0,
    };
  }).filter(Boolean).sort((a, b) => {
    if (a.dias == null && b.dias == null) return a.cantidad - b.cantidad;
    if (a.dias == null) return 1;
    if (b.dias == null) return -1;
    return a.dias - b.dias;
  });
}

/** Lo que consumes a menudo y no tienes en casa. */
function habitualesSinStock(diasMirar) {
  const uso = {};
  const n = diasMirar || 21;
  for (let i = 0; i < n; i++) {
    const log = dayLog(shiftDate(today(), -i));
    log.entries.forEach(e => {
      if (!e.food_id) return;
      uso[e.food_id] = (uso[e.food_id] || 0) + (e.qty || 0);
    });
  }
  return Object.keys(uso)
    .filter(id => pantryQty(id) <= 0 && foodById(id))
    .map(id => ({ food: foodById(id), gramos: uso[id], veces: uso[id] }))
    .sort((a, b) => b.gramos - a.gramos)
    .slice(0, 8);
}

/* Al registrar comida, descontar de la despensa: si no, el stock miente
   y la lista de la compra deja de servir. */
function consumeFood(foodId, grams) {
  const actual = pantryQty(foodId);
  if (actual <= 0) return;
  savePantry({ ingredient_id: foodId, estimated_quantity: Math.max(0, actual - grams) });
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function today() { return isoFromDate(new Date()); }
function isoFromDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function isoFromMs(ms) {
  const d = new Date(ms);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}
function shiftDate(fecha, delta) {
  const p = fecha.split('-').map(Number);
  return isoFromMs(Date.UTC(p[0], p[1] - 1, p[2]) + delta * 86400000);
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function round1(n) { return Math.round(n * 10) / 10; }
function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function dayName(fecha) {
  const d = new Date(fecha + 'T12:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'long' });
}
function shortDate(fecha) {
  const d = new Date(fecha + 'T12:00:00');
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}
function mealName(key) { const m = MEALS.find(x => x.key === key); return m ? m.name : key; }

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

        row('grasa', tot.fat, t.fat, 'g', '') +
        '<div class="ledger-row">' +
          '<span class="k">saturadas</span>' +
          bar(tot.sat, lim, tot.sat > lim ? 'crit' : 'warn') +
          '<span class="v num">' + fmt1(tot.sat) + ' <small>/ ' + lim + ' g</small></span>' +
        '</div>' +
      '</div>' +
      microLedger(tot) +
      (isToday ?
        '<div class="trained"><span>¿Entrenaste hoy?</span>' +
        '<button class="switch" id="trained-toggle" aria-pressed="' + (trainedOn(curDate) ? 'true' : 'false') +
        '" aria-label="Marcar si has entrenado hoy"></button></div>' : '') +
    '</div>';

  const al = alerts(curDate);
  const notes = al.length
    ? '<div class="notes">' + al.map(a =>
        '<div class="note ' + a.level + '"><i class="bar"></i><div><b>' + esc(a.title) + '</b>' +
        '<span>' + esc(a.detail) + '</span></div></div>').join('') + '</div>'
    : '';

  const dateNav =
    '<div class="weeknav">' +
      '<button class="btn small" data-act="day" data-d="-1" aria-label="Día anterior">‹</button>' +
      '<span class="lbl">' + (isToday ? 'Hoy' : dayName(curDate) + ' ' + shortDate(curDate)) + '</span>' +
      '<button class="btn small" data-act="day" data-d="1" ' + (isToday ? 'disabled style="opacity:.35"' : '') +
        ' aria-label="Día siguiente">›</button>' +
    '</div>';

  return dateNav + readout + notes + closeDayCard() + mealsSection();
}

/* Micronutrientes del día. Contexto informativo, no una regla:
   la fibra importa por el colesterol, y hierro, calcio y vitamina D
   son los que la usuaria quiere vigilar. */
function microLedger(tot) {
  const cell = (label, val, target, unit, dec) => {
    const pct = Math.min(100, (val / target) * 100);
    const shown = dec ? fmt1(val) : Math.round(val);
    return '<div class="micro"><div class="micro-top"><span class="mk">' + label + '</span>' +
      '<span class="mv num">' + shown + '<small> / ' + target + ' ' + unit + '</small></span></div>' +
      '<div class="rail"><i class="' + (pct >= 100 ? 'good' : '') + '" style="width:' + pct.toFixed(1) + '%"></i></div></div>';
  };
  return '<div class="micros">' +
    cell('Fibra', tot.fiber, MICRO_TARGETS.fiber, 'g', true) +
    cell('Hierro', tot.fe, MICRO_TARGETS.fe, 'mg', true) +
    cell('Calcio', tot.ca, MICRO_TARGETS.ca, 'mg', false) +
    cell('Vit. D', tot.vd, MICRO_TARGETS.vd, 'µg', true) +
  '</div>';
}

/* ---- Tarjeta central: qué comer para cerrar el día ---- */
function closeDayCard() {
  const rem = remaining(curDate);
  if (rem.kcal <= 25 && rem.prot <= 0) {
    return '<div class="card"><span class="eyebrow">Cerrado</span>' +
      '<p class="muted" style="margin:8px 0 0;font-size:13px">Has llegado a los objetivos del día. ' +
      'Proteína ' + Math.round(targets().protein - rem.prot) + ' g sobre un piso de ' + targets().protein + ' g.</p></div>';
  }
  const pending = pendingMeals(curDate);
  const key = suggestMeal || pending[0] || 'cena';
  const res = suggestFor(key, curDate, 3);

  const chips = '<div class="chips">' + MEALS.map(m =>
    '<button class="chip" data-act="suggest" data-meal="' + m.key + '" aria-pressed="' +
    (m.key === key ? 'true' : 'false') + '">' + m.name + '</button>').join('') + '</div>';

  const list = res.list.length ? res.list.map(s =>
    '<div class="sug">' +
      '<div class="sug-top">' +
        '<span class="sug-name">' + esc(s.recipe.name) + '</span>' +
        '<span class="fit" title="Encaje con lo que te falta">' + s.fit + '</span>' +
      '</div>' +
      '<div class="macro-row"><b>' + s.macros.kcal + ' kcal</b>' +
        '<span>P ' + fmt1(s.macros.prot) + '</span>' +
        '<span>C ' + fmt1(s.macros.carbs) + '</span>' +
        '<span>G ' + fmt1(s.macros.fat) + '</span>' +
        (s.factor !== 1 ? '<span class="pill">×' + s.factor + '</span>' : '') +
      '</div>' +
      (s.why.length ? '<div class="why">' + esc(s.why[0]) + '</div>' : '') +
      (s.careful.length ? '<div class="careful">' + esc(s.careful[0]) + '</div>' : '') +
      '<div class="sug-actions">' +
        '<button class="btn grow" data-act="recipe" data-id="' + s.recipe.id + '">Ver</button>' +
        '<button class="btn primary grow" data-act="log-sug" data-id="' + s.recipe.id +
          '" data-f="' + s.factor + '" data-meal="' + key + '">Registrar</button>' +
      '</div>' +
    '</div>').join('')
    : '<p class="empty">No hay recetas de ' + mealName(key).toLowerCase() +
      '. Crea una en la pestaña Recetas.</p>';

  const ings = suggestIngredients(curDate, 3);
  const ingBlock = ings.length
    ? '<div class="ing-close"><span class="eyebrow">O cierra con un ingrediente</span>' +
      ings.map(o =>
        '<button class="ing-row" data-act="log-ing" data-id="' + o.food.id + '" data-g="' + o.grams + '">' +
          '<span class="n">' + esc(o.food.nombre) + '</span>' +
          '<span class="g">' + o.grams + ' ' + (o.food.unit || 'g') + '</span>' +
          '<span class="m">' + Math.round(o.macros.kcal) + ' kcal · P' + Math.round(o.macros.prot) + '</span>' +
        '</button>').join('') + '</div>'
    : '';

  return '<div class="card">' +
    '<span class="eyebrow">¿Qué como para cerrar el día?</span>' +
    '<div style="margin-top:9px">' + chips + '</div>' +
    '<p class="hint">Para ' + mealName(key).toLowerCase() + ' te tocan ' +
      '<span class="num">' + Math.max(0, Math.round(res.gap.kcal)) + '</span> kcal y ' +
      '<span class="num">' + Math.max(0, Math.round(res.gap.prot)) + '</span> g de proteína' +
      (res.gap.isLast ? ', y es la última comida del día' : '') + '.</p>' +
    '<button class="btn primary wide" data-act="add-food" data-meal="' + key + '">' +
      'Montar mi ' + mealName(key).toLowerCase() + ' con mis ingredientes</button>' +
    '<div class="or-line"><span>o elige una de estas</span></div>' +
    '<div class="sugs">' + list + '</div>' +
    ingBlock +
  '</div>';
}

/* ---- Comidas registradas ---- */
function mealsSection() {
  const entries = dayLog(curDate).entries;
  const blocks = MEALS.map(m => {
    const mine = entries.filter(e => e.meal === m.key);
    const kcal = mine.reduce((a, e) => a + (e.kcal || 0), 0);
    const prot = mine.reduce((a, e) => a + (e.prot || 0), 0);
    const rows = mine.map(e =>
      '<div class="entry"><div class="info">' +
        '<span class="nm">' + esc(e.nombre) + '</span>' +
        '<span class="qt">' + e.qty + ' ' + e.unit + ' · P' + fmt1(e.prot) + ' C' + fmt1(e.carbs) + ' G' + fmt1(e.fat) + '</span>' +
      '</div><span class="kc num">' + Math.round(e.kcal) + '</span>' +
      '<button class="x" data-act="del-entry" data-id="' + e.id + '" aria-label="Quitar ' + esc(e.nombre) + '">✕</button></div>').join('');
    return '<div class="meal">' +
      '<div class="meal-head">' +
        '<span class="meal-name">' + m.name + '</span>' +
        '<span class="meal-kcal">' + (kcal ? Math.round(kcal) + ' kcal · P' + Math.round(prot) : '—') + '</span>' +
      '</div>' +
      (rows ? '<div class="entries">' + rows + '</div>' : '') +
      '<div class="meal-foot">' +
        '<button class="btn grow" data-act="add-food" data-meal="' + m.key + '">Poner mis ingredientes</button>' +
        '<button class="btn" data-act="suggest" data-meal="' + m.key + '" aria-label="Ver sugerencias para ' + m.name + '">✦</button>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div><div class="section-head"><h2>Lo que has comido</h2></div>' +
    '<div style="margin-top:9px">' + blocks + '</div></div>';
}

/* ============================================================
   VISTA · RECETAS
   ============================================================ */
function viewRecetas() {
  const filters = [{ key: 'todas', name: 'Todas' }].concat(MEALS);
  const chips = '<div class="chips scroll">' + filters.map(f =>
    '<button class="chip" data-act="rfilter" data-f="' + f.key + '" aria-pressed="' +
    (recipeFilter === f.key ? 'true' : 'false') + '">' + f.name + '</button>').join('') + '</div>';

  const list = (recipeFilter === 'todas' ? allRecipes() : recipesFor(recipeFilter))
    .slice()
    .sort((a, b) => {
      const d = (isHabitual(b) ? 1 : 0) - (isHabitual(a) ? 1 : 0);
      return d !== 0 ? d : a.name.localeCompare(b.name);
    });

  const cards = list.map(r => {
    const m = r.macros;
    const tags = (r.tags || []).filter(x => x !== 'habitual').slice(0, 3)
      .map(x => '<span class="tag">' + esc(x) + '</span>').join('');
    return '<button class="rec" data-act="recipe" data-id="' + r.id + '">' +
      '<div class="rec-top">' +
        '<span class="rec-name">' + esc(r.name) + '</span>' +
        (r.is_fixed ? '<span class="tag fixed">fija</span>' : '') +
        (isHabitual(r) ? '<span class="tag blue">habitual</span>' : '') +
      '</div>' +
      '<div class="macro-row"><b>' + m.kcal + ' kcal</b><span>P ' + fmt1(m.prot) +
        '</span><span>C ' + fmt1(m.carbs) + '</span><span>G ' + fmt1(m.fat) +
        '</span><span class="faint">sat ' + fmt1(m.sat) + '</span></div>' +
      '<div class="rec-foot">' + (recipeDensity(r) * 100).toFixed(1) + ' g proteína / 100 kcal ' +
        (tags ? '&nbsp; ' : '') + '</div>' +
      (tags ? '<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">' + tags + '</div>' : '') +
    '</button>';
  }).join('');

  return '<div class="card">' +
      '<span class="eyebrow">Crear con lo que te gusta</span>' +
      '<p class="hint" style="margin:7px 0 10px">Elige entre tus ingredientes favoritos, di qué macros quieres ' +
        'alcanzar y te calculo los gramos de cada cosa.</p>' +
      '<button class="btn primary wide" data-act="composer">Proponme recetas</button>' +
    '</div>' +
    chips +
    '<button class="btn wide" data-act="new-recipe">Escribir una receta a mano</button>' +
    '<div>' + (cards || '<p class="empty">No hay recetas en esta categoría.</p>') + '</div>';
}

/* ============================================================
   VISTA · MENÚ SEMANAL
   ============================================================ */
function viewMenu() {
  const ws = menuWeek || weekStartOf(today());
  const menu = getMenu(ws);
  const t = targets();
  const dates = weekDates(ws);

  const nav = '<div class="weeknav">' +
    '<button class="btn small" data-act="week" data-d="-7" aria-label="Semana anterior">‹</button>' +
    '<span class="lbl">' + shortDate(dates[0]) + ' – ' + shortDate(dates[6]) + '</span>' +
    '<button class="btn small" data-act="week" data-d="7" aria-label="Semana siguiente">›</button>' +
  '</div>';

  if (!menu) {
    return nav + '<div class="card"><span class="eyebrow">Sin menú</span>' +
      '<p class="muted" style="margin:8px 0 12px;font-size:13px">Se generará ajustando las porciones para ' +
      'cuadrar <span class="num">' + t.kcal + '</span> kcal y <span class="num">' + t.protein +
      '</span> g de proteína cada día, sin repetir receta en días seguidos.</p>' +
      '<button class="btn primary wide" data-act="gen-menu">Generar menú de la semana</button></div>';
  }

  const days = menu.days.map(day => {
    const dt = menuDayTotals(day);
    const isToday = day.date === today();
    const kcalOff = Math.abs(dt.kcal - t.kcal) > 150;
    const protOk = dt.prot >= t.protein;
    const satOver = dt.sat > satLimit(t);
    const slots = MEALS.map(m => {
      const slot = (day.meal_slots || []).find(s => s.meal_type === m.key);
      const r = slot ? slotRecipe(slot) : null;
      const locked = !!(slot && slot.is_locked);
      return '<div class="slot">' +
        '<span class="slot-key">' + m.short + '</span>' +
        '<button class="slot-body" data-act="swap" data-date="' + day.date + '" data-meal="' + m.key + '">' +
          '<span class="slot-name">' + (r ? esc(r.name) : '<span class="faint">— vacío —</span>') + '</span>' +
          (r ? '<span class="slot-macros">' + r.macros.kcal + ' kcal · P' + Math.round(r.macros.prot) +
               (slot.factor && slot.factor !== 1 ? ' · ×' + slot.factor : '') + '</span>' : '') +
        '</button>' +
        '<button class="lock" data-act="lock" data-date="' + day.date + '" data-meal="' + m.key +
          '" aria-pressed="' + (locked ? 'true' : 'false') +
          '" aria-label="' + (locked ? 'Desfijar' : 'Fijar') + ' ' + m.name + '">' +
          (locked ? '🔒' : '🔓') + '</button>' +
      '</div>';
    }).join('');
    return '<div class="day' + (isToday ? ' today' : '') + '">' +
      '<div class="day-head">' +
        '<span class="day-name">' + dayName(day.date) + ' ' + day.date.slice(8) + '</span>' +
        '<span class="day-tot"><span class="' + (kcalOff ? 'no' : '') + '">' + Math.round(dt.kcal) + ' kcal</span> · ' +
          '<span class="' + (protOk ? 'ok' : 'no') + '">P' + Math.round(dt.prot) + '</span>' +
          (satOver ? ' · <span class="no">sat↑</span>' : '') + '</span>' +
      '</div>' + slots + '</div>';
  }).join('');

  return nav +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn grow" data-act="gen-menu">Regenerar</button>' +
      '<button class="btn primary grow" data-act="go-shop">Lista de la compra</button>' +
    '</div>' +
    '<p class="hint" style="margin:0">Toca una comida para cambiarla. El candado la fija para que no se mueva al regenerar.</p>' +
    '<div>' + days + '</div>';
}

/* ============================================================
   VISTA · DESPENSA Y COMPRA
   ============================================================ */
function viewCompra() {
  const ws = menuWeek || weekStartOf(today());
  const menu = getMenu(ws);
  const lista = shoppingList(menu);
  const checked = DB.get('shop_' + ws, []);
  const estado = pantryStatus();
  const acabando = estado.filter(x => x.seAcaba);
  const faltanHabituales = habitualesSinStock();

  // ---- Lo que se está acabando, según lo que consumes ----
  const acabandoHtml = acabando.length
    ? acabando.map(x =>
        '<div class="prow"><div class="info">' +
          '<span class="nm">' + esc(shortName(x.food)) + '</span>' +
          '<span class="sub">' + (x.cantidad <= 0
            ? 'se ha terminado'
            : Math.round(x.cantidad) + ' ' + (x.food.unit || 'g') +
              (x.dias != null ? ' · para ' + x.dias + (x.dias === 1 ? ' día' : ' días') : '')) + '</span>' +
        '</div><button class="btn small" data-act="pan" data-id="' + x.food.id + '" data-d="500">+500</button></div>').join('')
    : '<p class="empty">Nada a punto de acabarse. Se calcula con lo que registras a diario.</p>';

  // ---- Recetas con lo que hay en casa ----
  const enCasa = pantry().filter(p => (p.estimated_quantity || 0) > 0).map(p => p.ingredient_id);
  let cocinarHtml;
  if (enCasa.length < 2) {
    cocinarHtml = '<p class="empty">Carga la compra y te propongo platos con lo que tengas.</p>';
  } else {
    const recetas = proposeRecipes(nutMealForPantry, enCasa, {}, { cuantas: 3 });
    cocinarHtml = recetas.length
      ? '<div class="chips" style="margin-bottom:10px">' + MEALS.map(m =>
          '<button class="chip" data-act="pantry-meal" data-meal="' + m.key + '" aria-pressed="' +
          (nutMealForPantry === m.key ? 'true' : 'false') + '">' + m.name + '</button>').join('') + '</div>' +
        recetas.map(r =>
          '<div class="cook-recipe"><div class="cook-top">' +
            '<span class="nm">' + esc(r.nombre) + '</span><span class="tag">⏱ ' + r.tiempo + ' min</span></div>' +
            '<div class="sub">' + r.items.map(x => shortName(x.food) + ' ' + x.grams + 'g').join(' · ') + '</div>' +
            (r.anadidos && r.anadidos.length
              ? '<div class="need-add">Te falta: ' + esc(r.anadidos.join(', ')) + '</div>' : '') +
            '<button class="btn small" data-act="log-pantry-recipe" data-i="' + recetas.indexOf(r) + '">Registrar</button>' +
          '</div>').join('')
      : '<p class="empty">Con lo que hay en casa no me sale ningún plato completo.</p>';
    pantryRecipes = recetas;
  }

  // ---- Despensa ----
  const items = pantry();
  const pantryHtml = items.length ? items.map(p => {
    const f = foodById(p.ingredient_id);
    if (!f) return '';
    return '<div class="prow"><div class="info">' +
      '<span class="nm">' + esc(f.nombre) + '</span>' +
      '<span class="sub">' + Math.round(p.estimated_quantity || 0) + ' ' + (f.unit || 'g') +
        (p.last_purchased ? ' · ' + p.last_purchased : '') + '</span>' +
      '</div><div class="stepper">' +
        '<button class="mini" data-act="pan" data-id="' + p.ingredient_id + '" data-d="-100" aria-label="Quitar 100">−</button>' +
        '<button class="mini" data-act="pan" data-id="' + p.ingredient_id + '" data-d="100" aria-label="Añadir 100">+</button>' +
        '<button class="x" data-act="pan-del" data-id="' + p.ingredient_id + '" aria-label="Quitar de la despensa">✕</button>' +
      '</div></div>';
  }).join('') : '<p class="empty">Vacía. Carga la compra y empieza.</p>';

  // ---- Lista de la compra: menú + reposición ----
  const lineas = {};
  if (lista) lista.groups.forEach(g => g.items.forEach(it => {
    lineas[it.id] = { food: foodById(it.id), cantidad: it.buy, motivo: 'para el menú' };
  }));
  acabando.forEach(x => {
    const falta = Math.max(defaultPurchase(x.food) - x.cantidad, 0);
    if (falta <= 0) return;
    if (lineas[x.food.id]) lineas[x.food.id].motivo += ' y se acaba';
    else lineas[x.food.id] = { food: x.food, cantidad: Math.round(falta), motivo: x.cantidad <= 0 ? 'se ha terminado' : 'te queda poco' };
  });
  faltanHabituales.forEach(x => {
    if (lineas[x.food.id]) return;
    lineas[x.food.id] = { food: x.food, cantidad: defaultPurchase(x.food), motivo: 'lo usas y no te queda' };
  });

  // Cada línea con su supermercado, para poder filtrar y agrupar
  const todas = Object.keys(lineas).map(id => {
    const l = lineas[id];
    if (!l.food) return null;
    return Object.assign({ id: id, tienda: storeOf(l.food) || SIN_TIENDA }, l);
  }).filter(Boolean);

  const cuentaPorTienda = {};
  todas.forEach(l => { cuentaPorTienda[l.tienda] = (cuentaPorTienda[l.tienda] || 0) + 1; });
  const orden = STORES.concat(
    Object.keys(cuentaPorTienda).filter(t => STORES.indexOf(t) < 0 && t !== SIN_TIENDA).sort()
  ).concat([SIN_TIENDA]);
  const tiendasConCosas = orden.filter(t => cuentaPorTienda[t]);

  const visibles = shopStore === 'todos' ? todas : todas.filter(l => l.tienda === shopStore);
  const total = todas.length;

  const filtro = tiendasConCosas.length > 1
    ? '<div class="chips scroll" style="margin-bottom:10px">' +
        '<button class="chip" data-act="shop-store" data-s="todos" aria-pressed="' +
          (shopStore === 'todos' ? 'true' : 'false') + '">Todos · ' + total + '</button>' +
        tiendasConCosas.map(t =>
          '<button class="chip" data-act="shop-store" data-s="' + esc(t) + '" aria-pressed="' +
          (shopStore === t ? 'true' : 'false') + '">' + esc(t) + ' · ' + cuentaPorTienda[t] + '</button>').join('') +
      '</div>'
    : '';

  const filaCompra = l => {
    const on = checked.indexOf(l.id) >= 0;
    const coste = lineCost(l.food, l.cantidad);
    return '<div class="shop-line">' +
      '<button class="shop" data-act="check" data-id="' + l.id + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        '<span class="box">' + (on ? '✓' : '') + '</span>' +
        '<span class="nm">' + esc(shortName(l.food)) +
          '<span class="motivo"> · ' + esc(l.motivo) + '</span></span>' +
        '<span class="qt">' + Math.round(l.cantidad) + ' ' + (l.food.unit || 'g') +
          (coste ? '<span class="eur">' + fmtEur(coste.euros) + '</span>' : '') +
        '</span></button>' +
      '<button class="tienda-btn" data-act="set-store" data-id="' + l.food.id +
        '" aria-label="Supermercado y precio de ' + esc(shortName(l.food)) + '">' +
        (l.tienda === SIN_TIENDA ? '+ súper' : esc(shortStore(l.tienda))) + '</button>' +
    '</div>';
  };

  // Con "Todos" se agrupa por súper, que es como se compra. Dentro de un
  // súper concreto se agrupa por categoría, que es como está la tienda.
  let shopHtml;
  if (!total) {
    shopHtml = '<p class="empty">Nada que comprar por ahora. Aparecerá aquí lo que necesite el menú y lo que se te vaya acabando.</p>';
  } else if (!visibles.length) {
    shopHtml = '<p class="empty">Nada pendiente en ' + esc(shopStore) + '.</p>';
  } else if (shopStore === 'todos') {
    const porTienda = {};
    visibles.forEach(l => { (porTienda[l.tienda] = porTienda[l.tienda] || []).push(l); });
    shopHtml = orden.filter(t => porTienda[t]).map(t =>
      '<div class="shop-group"><div class="shop-cat">' + esc(t) + '</div>' +
      porTienda[t].sort((a, b) => a.food.nombre.localeCompare(b.food.nombre)).map(filaCompra).join('') +
      '</div>').join('');
  } else {
    const porCat = {};
    visibles.forEach(l => { (porCat[l.food.cat || 'Otros'] = porCat[l.food.cat || 'Otros'] || []).push(l); });
    shopHtml = Object.keys(porCat).sort().map(cat =>
      '<div class="shop-group"><div class="shop-cat">' + esc(cat) + '</div>' +
      porCat[cat].sort((a, b) => a.food.nombre.localeCompare(b.food.nombre)).map(filaCompra).join('') +
      '</div>').join('');
  }
  shopHtml = filtro + shopHtml;

  // Coste estimado. Solo sé el precio de una parte del catálogo, así que
  // la cifra dice siempre sobre cuántos productos está hecha.
  const costes = visibles.map(l => lineCost(l.food, l.cantidad)).filter(Boolean);
  const costeHtml = !visibles.length ? ''
    : costes.length
      ? '<p class="hint" style="margin:7px 0 0">Coste estimado <strong>' +
          fmtEur(costes.reduce((s, c) => s + c.euros, 0)) + '</strong>' +
          (costes.length === visibles.length ? '' :
            ' · sobre ' + costes.length + ' de ' + visibles.length + '. Toca el súper de un producto para apuntar su precio.') + '</p>'
      : '<p class="hint" style="margin:7px 0 0">Toca el súper de un producto para apuntar su precio y que la lista sume un coste.</p>';

  return '<button class="btn primary wide" data-act="load-shopping">Cargar la compra</button>' +
    '<p class="hint" style="margin:-4px 0 0">Dicta lo que has comprado, sube un archivo o pega el ticket.</p>' +

    '<div><div class="section-head"><h2>Se te está acabando</h2>' +
      (acabando.length ? '<span class="rest">' + acabando.length + '</span>' : '') + '</div>' +
      '<div class="card" style="margin-top:9px">' + acabandoHtml + '</div></div>' +

    '<div><div class="section-head"><h2>Puedo cocinar con lo que tengo</h2></div>' +
      '<div class="card" style="margin-top:9px">' + cocinarHtml + '</div></div>' +

    '<div id="shop"><div class="section-head"><h2>Lista de la compra</h2>' +
      (total ? '<span class="rest">' + (shopStore === 'todos' ? total : visibles.length + ' de ' + total) + '</span>' : '') + '</div>' +
      '<div class="card shop-list" style="margin-top:9px">' + shopHtml + '</div>' + costeHtml + '</div>' +

    '<div><div class="section-head"><h2>Mi despensa</h2>' +
      '<span class="rest">' + items.length + '</span></div>' +
      '<button class="btn wide" style="margin:9px 0" data-act="pan-add">Añadir un alimento suelto</button>' +
      '<div class="card">' + pantryHtml + '</div></div>';
}

/* ============================================================
   CARGAR LA COMPRA
   Tres vías porque ninguna sirve siempre: dictar es lo más rápido
   al volver del súper, el archivo va bien con el ticket digital y
   pegar texto funciona en cualquier móvil.
   ============================================================ */
let dictado = null;

function hayDictado() {
  return typeof window !== 'undefined' &&
    (window.SpeechRecognition || window.webkitSpeechRecognition);
}

function sheetLoadShopping() {
  shoppingDraft = null;
  const nPedido = ULTIMA_COMPRA.items.filter(it => foodById(it.id)).length;

    '<button class="btn wide" id="ult-compra" style="margin-bottom:4px">📦 Mi último pedido de ' +

    '<p class="hint" style="margin:0 0 14px">' + shortDate(ULTIMA_COMPRA.fecha) + ' · ' +
      fmtEur(ULTIMA_COMPRA.total) + '. Se suma a lo que ya tengas en la despensa.</p>' +
    '<div class="chips" id="load-tabs">' +
      (hayDictado() ? '<button class="chip" data-modo="voz" aria-pressed="true">🎤 Dictar</button>' : '') +
      '<button class="chip" data-modo="archivo" aria-pressed="' + (hayDictado() ? 'false' : 'true') + '">📄 Archivo</button>' +
      '<button class="chip" data-modo="texto" aria-pressed="false">⌨️ Escribir</button>' +
    '</div>' +
    '<div id="load-body"></div>' +
    '<div id="load-review"></div>';

  openSheet('Cargar la compra', body, scrim => {
    scrim.querySelector('#ult-compra').onclick = () => {
      const n = cargarUltimaCompra();
      closeSheet();
      render();
      toast(n + ' productos en la despensa');
    };
    scrim.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => {
      scrim.querySelectorAll('[data-modo]').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      paintLoadMode(b.dataset.modo);
    });
    paintLoadMode(hayDictado() ? 'voz' : 'archivo');
  });
}

function paintLoadMode(modo) {
  const box = document.getElementById('load-body');
  if (!box) return;
  pararDictado();

  if (modo === 'voz') {
    box.innerHTML =
      '<p class="hint" style="margin:0 0 10px">Di lo que has comprado del tirón: «dos kilos de pechuga de pollo, ' +
        'media docena de huevos, un litro de leche, tomate cherry». Puedes parar y seguir.</p>' +
      '<button class="btn primary wide" id="mic-btn">Empezar a dictar</button>' +
      '<div class="dictado" id="dictado-texto"></div>' +
      '<button class="btn wide" id="voz-listo" style="display:none">Revisar lo dictado</button>';
    const btn = box.querySelector('#mic-btn');
    btn.onclick = () => (dictado && dictado.activo) ? pararDictado(true) : empezarDictado();
    box.querySelector('#voz-listo').onclick = () => {
      const t = document.getElementById('dictado-texto').dataset.texto || '';
      if (!t.trim()) { toast('No he oído nada todavía'); return; }
      revisarCompra(t);
    };
  } else if (modo === 'archivo') {
    box.innerHTML =
      '<p class="hint" style="margin:0 0 10px">Sube un archivo de texto o CSV con un producto por línea. ' +
        'Vale el ticket digital del súper si puedes exportarlo como texto.</p>' +
      '<input type="file" id="archivo" accept=".txt,.csv,.md,text/plain,text/csv" class="input">' +
      '<p class="hint" style="margin:8px 0 0">De un PDF o una foto no puedo leer el texto: esta app funciona ' +
        'sin conexión y no lleva reconocimiento de imagen. Copia el contenido y pégalo en «Escribir».</p>';
    box.querySelector('#archivo').onchange = ev => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const fr = new FileReader();
      fr.onload = () => revisarCompra(String(fr.result || ''));
      fr.onerror = () => toast('No he podido leer ese archivo');
      fr.readAsText(file);
    };
  } else {
    box.innerHTML =
      '<p class="hint" style="margin:0 0 10px">Un producto por línea, o separados por comas. ' +
        'Las cantidades son opcionales.</p>' +
      '<textarea class="ta" id="texto-compra" rows="6" placeholder="2 kg pechuga de pollo&#10;6 huevos&#10;250 g arándanos&#10;pan integral"></textarea>' +
      '<button class="btn primary wide" style="margin-top:10px" id="texto-listo">Revisar</button>';
    box.querySelector('#texto-listo').onclick = () => {
      const t = document.getElementById('texto-compra').value;
      if (!t.trim()) { toast('Escribe algo primero'); return; }
      revisarCompra(t);
    };
  }
}

function empezarDictado() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Este móvil no permite dictar'); return; }
  const rec = new SR();
  rec.lang = 'es-ES';
  rec.continuous = true;
  rec.interimResults = true;
  let acumulado = '';

  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) acumulado += t + '\n'; else interim += t;
    }
    const box = document.getElementById('dictado-texto');
    if (box) {
      box.dataset.texto = acumulado;
      box.innerHTML = esc(acumulado) + (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
      const listo = document.getElementById('voz-listo');
      if (listo) listo.style.display = acumulado.trim() ? 'block' : 'none';
    }
  };
  rec.onerror = ev => {
    pararDictado();
    toast(ev.error === 'not-allowed'
      ? 'Tienes que dar permiso al micrófono'
      : 'El dictado se ha cortado; prueba a escribirlo');
  };
  rec.onend = () => { if (dictado && dictado.activo) { try { rec.start(); } catch (e) {} } };

  dictado = { rec: rec, activo: true };
  try { rec.start(); } catch (e) { toast('No he podido abrir el micrófono'); dictado = null; return; }
  const btn = document.getElementById('mic-btn');
  if (btn) { btn.textContent = 'Parar'; btn.classList.add('grabando'); }
}

function pararDictado(avisar) {
  if (!dictado) return;
  dictado.activo = false;
  try { dictado.rec.stop(); } catch (e) {}
  dictado = null;
  const btn = document.getElementById('mic-btn');
  if (btn) { btn.textContent = 'Seguir dictando'; btn.classList.remove('grabando'); }
  if (avisar) {
    const listo = document.getElementById('voz-listo');
    if (listo && (document.getElementById('dictado-texto').dataset.texto || '').trim()) listo.style.display = 'block';
  }
}

/* Revisión antes de guardar: interpretar es adivinar, así que lo que se
   ha entendido se enseña y se puede corregir línea a línea. */
function revisarCompra(texto) {
  pararDictado();
  shoppingDraft = parseShoppingText(texto);
  if (!shoppingDraft.length) { toast('No he encontrado productos ahí'); return; }
  paintReview();
  const r = document.getElementById('load-review');
  if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function paintReview() {
  const box = document.getElementById('load-review');
  if (!box || !shoppingDraft) return;
  const reconocidos = shoppingDraft.filter(l => l.food).length;

  box.innerHTML =
    '<div class="or-line"><span>' + reconocidos + ' de ' + shoppingDraft.length + ' reconocidos</span></div>' +
    '<p class="hint" style="margin:0 0 8px">¿De qué súper es esta compra? Se guarda para la próxima lista.</p>' +
    '<div class="chips scroll" style="margin-bottom:12px">' +
      STORES.map(t => '<button class="chip" data-tienda="' + esc(t) + '" aria-pressed="' +
        (loadStore === t ? 'true' : 'false') + '">' + esc(t) + '</button>').join('') +
    '</div>' +
    shoppingDraft.map((l, i) => {
      if (!l.food) {
        return '<div class="rev-row rev-no"><div class="info">' +
          '<span class="nm">' + esc(l.raw) + '</span>' +
          '<span class="sub">no lo tengo en el catálogo</span></div>' +
          '<button class="btn small" data-buscar="' + i + '">Buscar</button>' +
          '<button class="x" data-quitar="' + i + '" aria-label="Descartar">✕</button></div>';
      }
      return '<div class="rev-row"><div class="info">' +
        '<button class="rev-name" data-buscar="' + i + '">' + esc(l.food.nombre) +
          '<span class="cambiar"> cambiar</span></button>' +
        '<span class="sub">' + esc(l.raw) + '</span></div>' +
        '<input type="number" inputmode="numeric" min="1" max="20000" value="' + l.gramos + '" data-g="' + i + '">' +
        '<span class="u">' + (l.food.unit || 'g') + '</span>' +
        '<button class="x" data-quitar="' + i + '" aria-label="Descartar">✕</button></div>';
    }).join('') +
    '<button class="btn primary wide" style="margin-top:12px" data-guardar>Añadir ' + reconocidos + ' a la despensa</button>';

  box.querySelectorAll('[data-tienda]').forEach(b => b.onclick = () => {
    loadStore = loadStore === b.dataset.tienda ? null : b.dataset.tienda;
    paintReview();
  });
  box.querySelectorAll('[data-g]').forEach(inp => inp.oninput = () => {
    const v = parseInt(inp.value, 10);
    if (!isNaN(v) && v > 0) shoppingDraft[+inp.dataset.g].gramos = v;
  });
  box.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
    shoppingDraft.splice(+b.dataset.quitar, 1);
    paintReview();
  });
  box.querySelectorAll('[data-buscar]').forEach(b => b.onclick = () => {
    const i = +b.dataset.buscar;
    sheetPicker('Elegir producto', food => {
      shoppingDraft[i].food = food;
      shoppingDraft[i].gramos = shoppingDraft[i].gramos || defaultPurchase(food);
      sheetLoadShopping();
      setTimeout(() => { paintReview(); }, 60);
    });
  });
  box.querySelector('[data-guardar]').onclick = () => {
    let n = 0;
    shoppingDraft.forEach(l => {
      if (!l.food) return;
      savePantry({
        ingredient_id: l.food.id,
        estimated_quantity: pantryQty(l.food.id) + l.gramos,
        last_purchased: today(),
      });
      if (loadStore) setStore(l.food.id, loadStore);
      n++;
    });
    loadStore = null;
    shoppingDraft = null;
    closeSheet();
    tab = 'compra'; render();
    toast(n + (n === 1 ? ' producto añadido' : ' productos añadidos a la despensa'));
  };
}

/* ============================================================
   HOJAS MODALES
   ============================================================ */
function openSheet(title, bodyHtml, onMount) {
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.id = 'scrim';
  scrim.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h3>' + esc(title) + '</h3>' +
        '<button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>' +
      '<div class="sheet-body">' + bodyHtml + '</div>' +
    '</div>';
  document.getElementById('sheets').appendChild(scrim);
  requestAnimationFrame(() => scrim.classList.add('on'));
  scrim.addEventListener('click', ev => {
    if (ev.target === scrim || ev.target.closest('[data-close]')) closeSheet();
  });
  if (onMount) onMount(scrim);
  return scrim;
}
function closeSheet() {
  const s = document.getElementById('scrim');
  if (!s) return;
  s.classList.remove('on');
  setTimeout(() => s.remove(), 220);
}

/* ---- Registrar una receta en el día ---- */
function logRecipe(recipe, factor, mealKey) {
  const scaled = (factor && factor !== 1) ? scaleRecipe(recipe, factor) : recipe;
  const stamp = Date.now();
  (scaled.ingredients || []).forEach((ing, i) => {
    const f = foodById(ing.ingredient_id);
    if (!f) return;
    const m = macrosOf(f, ing.amount_g);
    addEntry(curDate, {
      id: 'e' + stamp + '_' + i, meal: mealKey, nombre: f.nombre,
      qty: ing.amount_g, unit: f.unit || 'g',
      kcal: Math.round(m.kcal), prot: round1(m.prot), carbs: round1(m.carbs),
      fat: round1(m.fat), sat: round1(m.sat), fiber: round1(m.fiber),
      fe: round1(m.fe), ca: Math.round(m.ca), vd: round1(m.vd),
      food_id: f.id, recipe_id: recipe.id,
    });
  });
  bumpUsage(recipe.id);
  consumeFromPantry(scaled);
  closeSheet();
  suggestMeal = null;
  render();
  toast(recipe.name + ' registrado');
}

/* ---- Ficha de receta ---- */
function sheetRecipe(id) {
  const r = recipeById(id);
  if (!r) return;
  const m = r.macros;
  const warn = powderWarning(r);
  const ings = (r.ingredients || []).map(i => {
    const f = foodById(i.ingredient_id);
    if (!f) return '<div class="detail-ing"><span class="nm faint">ingrediente desconocido</span></div>';
    const im = macrosOf(f, i.amount_g);
    return '<div class="detail-ing"><span class="nm">' + esc(f.nombre) + '</span>' +
      '<span class="g">' + i.amount_g + ' ' + (f.unit || 'g') + '</span>' +
      '<span class="m">' + Math.round(im.kcal) + ' kcal · P' + fmt1(im.prot) + '</span></div>';
  }).join('');

  const body =
    '<div class="preview"><b>' + m.kcal + ' kcal</b>' +
      '<span>P ' + fmt1(m.prot) + ' g</span><span>C ' + fmt1(m.carbs) + ' g</span>' +
      '<span>G ' + fmt1(m.fat) + ' g</span></div>' +
    '<p class="hint" style="margin:0">Saturadas ' + fmt1(m.sat) + ' g · fibra ' + fmt1(m.fiber) +
      ' g · ' + (recipeDensity(r) * 100).toFixed(1) + ' g de proteína por 100 kcal</p>' +
    (warn ? '<div class="note warn"><i class="bar"></i><div><b>Ojo con la proteína en polvo</b><span>' + esc(warn) + '</span></div></div>' : '') +
    '<div><span class="eyebrow">Ingredientes</span><div style="margin-top:6px">' +
      (ings || '<p class="empty">Sin ingredientes.</p>') + '</div></div>' +
    (r.notes ? '<div class="notes-box">' + esc(r.notes) + '</div>' : '') +
    '<button class="btn primary wide" data-r-log>Registrar en ' + mealName(r.meal_type).toLowerCase() + '</button>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn grow" data-r-edit>Editar</button>' +
      '<button class="btn grow" data-r-fix>' + (r.is_fixed ? 'Hacer flexible' : 'Marcar fija') + '</button>' +
    '</div>' +
    '<button class="btn danger wide" data-r-del>Eliminar receta</button>';

  openSheet(r.name, body, scrim => {
    scrim.querySelector('[data-r-log]').onclick = () =>
      logRecipe(r, fitFactor(r, shareForMeal(curDate, r.meal_type)), r.meal_type);
    scrim.querySelector('[data-r-edit]').onclick = () => { closeSheet(); setTimeout(() => sheetEditor(r.id), 240); };
    scrim.querySelector('[data-r-fix]').onclick = () => {
      saveRecipe(Object.assign({}, r, { is_fixed: !r.is_fixed }));
      closeSheet(); render();
      toast(r.is_fixed ? 'Ahora es flexible' : 'Ahora es fija');
    };
    scrim.querySelector('[data-r-del]').onclick = () => {
      deleteRecipe(r.id); closeSheet(); render(); toast('Receta eliminada');
    };
  });
}

  const existing = id ? recipeById(id) : null;
