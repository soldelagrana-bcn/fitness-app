    (warn ? '<div class="note warn"><i class="bar"></i><div><b>Proteína en polvo</b><span>' + esc(warn) + '</span></div></div>' : '') +
    '<div class="field"><label for="ed-tags">Etiquetas separadas por comas</label>' +
      '<input class="input" id="ed-tags" value="' + esc((draft.tags || []).join(', ')) + '" placeholder="dulce, rapido, habitual"></div>' +
    '<label class="checkline"><input type="checkbox" id="ed-fixed"' + (draft.is_fixed ? ' checked' : '') + '>' +
      '<span>Comida fija: el planificador no la mueve</span></label>' +
    '<div class="field"><label for="ed-notes">Notas</label>' +
      '<textarea class="ta" id="ed-notes" placeholder="Opcional">' + esc(draft.notes || '') + '</textarea></div>' +
    '<button class="btn primary wide" data-save>Guardar receta</button>' +
    '</div>';

  box.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => {
    pullEditor(); draft.meal_type = b.dataset.mt; paintEditor();
  });
  box.querySelectorAll('[data-q]').forEach(inp => inp.oninput = () => {
    draft.ingredients[+inp.dataset.q].amount_g = Math.max(1, parseInt(inp.value, 10) || 0);
    const mm = recipeMacros(draft);
    const p = document.getElementById('ed-prev');
    if (p) p.innerHTML = '<b>' + mm.kcal + ' kcal</b><span>P ' + fmt1(mm.prot) + '</span><span>C ' +
      fmt1(mm.carbs) + '</span><span>G ' + fmt1(mm.fat) + '</span><span>sat ' + fmt1(mm.sat) + '</span>';
  });
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    pullEditor(); draft.ingredients.splice(+b.dataset.rm, 1); paintEditor();
  });
  box.querySelector('[data-add-ing]').onclick = () => {
    pullEditor();
    sheetPicker('Añadir ingrediente', food => {
      draft.ingredients.push({ ingredient_id: food.id, amount_g: defaultGrams(food) });
      openEditorSheet();
    });
  };
  box.querySelector('[data-save]').onclick = () => {
    pullEditor();
    if (!draft.name.trim()) { toast('Ponle nombre a la receta'); return; }
    if (!draft.ingredients.length) { toast('Añade al menos un ingrediente'); return; }
    saveRecipe(draft);
    closeSheet();
    tab = 'recetas'; render();
    toast('Receta guardada');
  };
}
function pullEditor() {
  if (!draft) return;
  const n = document.getElementById('ed-name');
  const t = document.getElementById('ed-tags');
  const f = document.getElementById('ed-fixed');
  const o = document.getElementById('ed-notes');
  if (n) draft.name = n.value;
  if (t) draft.tags = t.value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
  if (f) draft.is_fixed = f.checked;
  if (o) draft.notes = o.value;
}

/* ============================================================
   HOJA: PROPONME UNA RECETA
   ============================================================ */
let composer = null;
let pantryRecipes = [];

function sheetComposer(meal) {
  const m = meal || 'desayuno';
  const gap = shareForMeal(curDate, m);
  const w = (MEALS.find(x => x.key === m) || {}).weight || 0.25;
  composer = {
    meal: m,
    // Se empieza en blanco: tocar un ingrediente lo mete en la receta.
    // Al revés (todos puestos y tocar para quitar) se lee como tachar.
    selected: [],
    targets: {
      prot: Math.max(10, Math.round(gap.prot)),
      carbs: Math.max(10, Math.round(gap.carbs)),
      fiber: Math.round(MICRO_TARGETS.fiber * w),
    },
    fijos: {},
    maxTiempo: 0,
    results: [],
    faltan: [],
  };
  openSheet('Proponme recetas', '<div id="cp"></div>', () => paintComposer());
}

function paintComposer() {
  const box = document.getElementById('cp');
  if (!box || !composer) return;
  const favs = favorites(composer.meal);
  const extras = composer.selected.filter(id => favs.indexOf(id) < 0);

  const chipFor = (id, esFav) => {
    const f = foodById(id);
    if (!f) return '';
    const on = composer.selected.indexOf(id) >= 0;
    return '<button class="fav-chip" data-tog="' + id + '" aria-pressed="' + (on ? 'true' : 'false') +
      '" title="' + esc(f.nombre) + '">' + (on ? '<span class="tick">✓</span>' : '') +
      esc(shortName(f)) + (esFav ? '' : ' <span class="faint">·nuevo</span>') + '</button>';
  };

  const elegidos = composer.selected.map(id => {
    const f = foodById(id);
    if (!f) return '';
    const fijo = composer.fijos[id];
    return '<div class="ing-edit"><span class="nm">' + esc(shortName(f)) + '</span>' +
      '<input type="number" inputmode="numeric" min="1" max="2000" placeholder="auto" ' +
        'value="' + (fijo || '') + '" data-fijo="' + id + '">' +
      '<span class="u">' + (f.unit || 'g') + '</span></div>';
  }).join('');

  box.innerHTML =
    '<div class="field"><label>Comida</label><div class="chips">' +
      MEALS.map(t => '<button class="chip" data-cmeal="' + t.key + '" aria-pressed="' +
        (composer.meal === t.key ? 'true' : 'false') + '">' + t.name + '</button>').join('') +
    '</div></div>' +

    '<div class="field"><label>Tiempo que tienes</label><div class="chips">' +
      [{ v: 10, t: '10 min' }, { v: 20, t: '20 min' }, { v: 30, t: '30 min' }, { v: 0, t: 'El que haga falta' }]
        .map(o => '<button class="chip" data-time="' + o.v + '" aria-pressed="' +
          (composer.maxTiempo === o.v ? 'true' : 'false') + '">' + o.t + '</button>').join('') +
    '</div></div>' +

    '<div class="field"><label>Elige los ingredientes de hoy' +
        (composer.selected.length ? ' · ' + composer.selected.length + ' elegidos' : '') + '</label>' +
      (favs.length
        ? '<div class="fav-wrap">' + favs.map(id => chipFor(id, true)).join('') + '</div>' +
          '<p class="hint" style="margin:6px 0 0">Toca los que quieras comer.</p>'
        : '<p class="empty">Aún no tienes favoritos de esta comida. Búscalos abajo y toca la estrella.</p>') +
      (extras.length ? '<div class="fav-wrap" style="margin-top:8px">' + extras.map(id => chipFor(id, false)).join('') + '</div>' : '') +
    '</div>' +

    (composer.selected.length
      ? '<div class="field"><label>Cantidades que quieres fijar</label>' + elegidos +
        '<p class="hint" style="margin:6px 0 0">Deja en blanco lo que quieras que calcule yo. ' +
        'Lo que fijes entra en la receta sí o sí, con esos gramos exactos.</p></div>'
      : '') +

    '<div class="field"><label for="cp-q">Buscar otro ingrediente</label>' +
      '<input class="input" id="cp-q" type="search" placeholder="Buscar en los ' + allFoods().length + ' alimentos" ' +
        'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
      '<div id="cp-res"></div>' +
    '</div>' +

    '<div class="field"><label>Qué quieres alcanzar</label><div class="grid3">' +
      '<label class="tiny-field"><span>Proteína g</span><input class="input numeric" id="cp-prot" type="number" inputmode="numeric" value="' + (composer.targets.prot || '') + '"></label>' +
      '<label class="tiny-field"><span>Carbos g</span><input class="input numeric" id="cp-carbs" type="number" inputmode="numeric" value="' + (composer.targets.carbs || '') + '"></label>' +
      '<label class="tiny-field"><span>Fibra g</span><input class="input numeric" id="cp-fiber" type="number" inputmode="numeric" value="' + (composer.targets.fiber || '') + '"></label>' +
    '</div><p class="hint" style="margin:6px 0 0">Deja en blanco lo que no te importe.</p></div>' +

    '<button class="btn primary wide" data-calc>Proponme recetas</button>' +
    '<div id="cp-out">' + composerResults() + '</div>';

  box.querySelectorAll('[data-cmeal]').forEach(b => b.onclick = () => {
    pullComposer();
    composer.meal = b.dataset.cmeal;
    composer.selected = []; composer.fijos = {}; composer.results = [];
    const gap = shareForMeal(curDate, composer.meal);
    const w = (MEALS.find(x => x.key === composer.meal) || {}).weight || 0.25;
    composer.targets = { prot: Math.max(10, Math.round(gap.prot)), carbs: Math.max(10, Math.round(gap.carbs)),
                         fiber: Math.round(MICRO_TARGETS.fiber * w) };
    paintComposer();
  });
  box.querySelectorAll('[data-time]').forEach(b => b.onclick = () => {
    pullComposer(); composer.maxTiempo = parseInt(b.dataset.time, 10); paintComposer();
  });
  box.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    pullComposer();
    const id = b.dataset.tog, i = composer.selected.indexOf(id);
    if (i >= 0) { composer.selected.splice(i, 1); delete composer.fijos[id]; }
    else composer.selected.push(id);
    paintComposer();
  });
  box.querySelectorAll('[data-fijo]').forEach(inp => inp.oninput = () => {
    const v = parseInt(inp.value, 10);
    if (isNaN(v) || v <= 0) delete composer.fijos[inp.dataset.fijo];
    else composer.fijos[inp.dataset.fijo] = v;
  });
  const q = box.querySelector('#cp-q');
  q.addEventListener('input', () => composerSearch(q.value.trim()));
  box.querySelector('[data-calc]').onclick = () => {
    pullComposer();
    if (composer.selected.length < 2) { toast('Toca al menos dos ingredientes'); return; }
    composer.results = proposeRecipes(composer.meal, composer.selected, composer.targets, {
      maxTiempo: composer.maxTiempo, fijos: composer.fijos, cuantas: 3,
    });
    composer.faltan = missingRoleSuggestions(composer.meal, composer.selected, { maxTiempo: composer.maxTiempo });
    const out = document.getElementById('cp-out');
    out.innerHTML = composerResults();
    bindComposerResults();
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  bindComposerResults();
}

function pullComposer() {
  const num = id => {
    const el = document.getElementById(id);
    if (!el || el.value === '') return null;
    const v = parseInt(el.value, 10);
    return isNaN(v) ? null : v;
  };
  const t = { prot: num('cp-prot'), carbs: num('cp-carbs'), fiber: num('cp-fiber') };
  Object.keys(t).forEach(k => { if (t[k] == null) delete t[k]; });
  composer.targets = t;
}

function composerSearch(term) {
  const box = document.getElementById('cp-res');
  if (!box) return;
  if (norm(term).length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = searchFoods(term, 12).map(f => {
    const fav = isFavorite(composer.meal, f.id);
    return '<div class="pick"><button class="pick-main" data-use="' + f.id + '"><div class="info">' +
      '<span class="nm">' + esc(f.nombre) + '</span>' +
      '<span class="sub">' + f.kcal100 + ' kcal · P' + f.prot100 + ' C' + f.carbs100 + ' G' + f.fat100 +
        ' / 100 ' + (f.unit || 'g') + '</span></div></button>' +
      '<button class="star" data-fav="' + f.id + '" aria-pressed="' + (fav ? 'true' : 'false') +
        '" aria-label="Guardar en favoritos">' + (fav ? '★' : '☆') + '</button></div>';
  }).join('');
  box.querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
    pullComposer();
    if (composer.selected.indexOf(b.dataset.use) < 0) composer.selected.push(b.dataset.use);
    document.getElementById('cp-q').value = '';
    paintComposer();
    toast(shortName(foodById(b.dataset.use)) + ' añadido');
  });
  box.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => {
    pullComposer();
    toggleFavorite(composer.meal, b.dataset.fav);
    const ahora = isFavorite(composer.meal, b.dataset.fav);
    if (ahora && composer.selected.indexOf(b.dataset.fav) < 0) composer.selected.push(b.dataset.fav);
    paintComposer();
    toast(shortName(foodById(b.dataset.fav)) + (ahora ? ' guardado en favoritos' : ' quitado de favoritos'));
  });
}

function composerResults() {
  if (!composer.results.length && !(composer.faltan || []).length) return '';
  if (!composer.results.length) {
    return '<div class="or-line"><span>sin recetas</span></div>' +
      '<p class="empty">Con esos ingredientes y ese tiempo no me sale ningún plato. ' +
      'Prueba a darte más tiempo o añade algo de lo de abajo.</p>' + composerMissing();
  }
  return '<div class="or-line"><span>' +
      (composer.results.length === 1 ? 'una receta' : composer.results.length + ' recetas') + '</span></div>' +
    composer.results.map((r, i) => {
      const cuadra = r.gaps.length === 0;
      const ing = r.items.map(x =>
        '<div class="detail-ing"><span class="nm">' + esc(x.food.nombre) +
          '<span class="role"> · ' + esc(x.role) + '</span></span>' +
        '<span class="g">' + x.grams + ' ' + (x.food.unit || 'g') +
          (x.uds ? ' <span class="faint">· ' + x.uds + (x.uds === 1 ? ' ud' : ' uds') + '</span>' : '') +
          (x.fijo ? ' <span class="pin">fijo</span>' : '') +
          (x.anadido ? ' <span class="pin add">te falta</span>' : '') + '</span></div>').join('');
      const compra = missingFromPantry(r.items);
      return '<div class="option' + (i === 0 ? ' option-full' : '') + '">' +
        '<div class="option-head"><span class="recipe-title">' + esc(r.nombre) + '</span></div>' +
        '<div class="recipe-meta"><span class="tag">⏱ ' + r.tiempo + ' min</span>' +
          (cuadra ? '<span class="tag blue">cuadra tus macros</span>' : '') +
          (r.sinUsar.length === 0 ? '<span class="tag blue">lleva todo lo tuyo</span>' : '') +
          (r.fueraDeTiempo ? '<span class="tag warn-tag">más de lo que tienes</span>' : '') + '</div>' +
        ing +
        '<div class="macro-row" style="margin-top:8px"><b>' + Math.round(r.totals.kcal) + ' kcal</b>' +
          '<span>P ' + fmt1(r.totals.prot) + '</span><span>C ' + fmt1(r.totals.carbs) + '</span>' +
          '<span>G ' + fmt1(r.totals.fat) + '</span><span>fibra ' + fmt1(r.totals.fiber) + '</span></div>' +
        (r.gaps.length ? '<div class="careful">' + r.gaps.map(g =>
            g.label + ' ' + (g.diff > 0 ? '+' : '−') + Math.abs(Math.round(g.diff)) + ' g').join(' · ') + '</div>' : '') +
        (r.anadidos && r.anadidos.length
          ? '<div class="need-add">Necesitas añadir: ' + esc(r.anadidos.join(', ')) + '</div>' : '') +
        (r.sinUsar.length ? '<div class="quita">No lleva: ' + esc(r.sinUsar.join(', ')) +
          ' — no tienen sitio en este plato</div>' : '') +
        '<details class="pasos"><summary>Cómo se hace</summary><ol>' +
          r.pasos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></details>' +
        (pantry().length === 0
          ? ''
          : compra.length
            ? '<div class="need-buy">Te falta en casa: ' + compra.map(c =>
                esc(c.nombre) + ' <span class="num">' + c.falta + ' ' + c.unit + '</span>').join(', ') + '</div>'
            : '<div class="have-all">Tienes todo en casa</div>') +
        '<div class="sug-actions">' +
          '<button class="btn grow" data-save-opt="' + i + '">Guardar receta</button>' +
          '<button class="btn primary grow" data-log-opt="' + i + '">Registrar ahora</button>' +
        '</div>' +
      '</div>';
    }).join('') + composerMissing();
}

/* Lo que le falta para desbloquear más formatos. Al ir por papeles,
   nunca sugiere algo que no pinte nada en esa comida. */
function composerMissing() {
  const f = composer.faltan || [];
  if (!f.length) return '';
  return '<div class="suggest-extra"><b>Con un ingrediente más podrías hacer:</b>' +
    f.slice(0, 3).map(x =>
      '<div class="miss-row"><span>' + esc(x.formatos.join(', ')) + ' — te falta ' + esc(x.role.label) +
      '</span><button class="link-btn" data-add-role="' + x.food.id + '">Añadir ' +
      esc(shortName(x.food)) + '</button></div>').join('') + '</div>';
}

function bindComposerResults() {
  const out = document.getElementById('cp-out');
  if (!out) return;
  out.querySelectorAll('[data-add-role]').forEach(b => b.onclick = () => {
    if (composer.selected.indexOf(b.dataset.addRole) < 0) composer.selected.push(b.dataset.addRole);
    composer.results = proposeRecipes(composer.meal, composer.selected, composer.targets, {
      maxTiempo: composer.maxTiempo, fijos: composer.fijos, cuantas: 3 });
    composer.faltan = missingRoleSuggestions(composer.meal, composer.selected, { maxTiempo: composer.maxTiempo });
    paintComposer();
    toast('Añadido ' + shortName(foodById(b.dataset.addRole)));
  });
  out.querySelectorAll('[data-log-opt]').forEach(b => b.onclick = () => {
    const r = composer.results[+b.dataset.logOpt];
    const stamp = Date.now();
    r.items.forEach((x, i) => {
      const m = macrosOf(x.food, x.grams);
      addEntry(curDate, {
        id: 'c' + stamp + '_' + i, meal: composer.meal, nombre: x.food.nombre,
        qty: x.grams, unit: x.food.unit || 'g',
        kcal: Math.round(m.kcal), prot: round1(m.prot), carbs: round1(m.carbs),
        fat: round1(m.fat), sat: round1(m.sat), fiber: round1(m.fiber),
        fe: round1(m.fe), ca: Math.round(m.ca), vd: round1(m.vd),
        food_id: x.food.id,
      });
      consumeFood(x.food.id, x.grams);
    });
    closeSheet(); tab = 'hoy'; render();
    toast('Registrado en ' + mealName(composer.meal).toLowerCase());
  });
  out.querySelectorAll('[data-save-opt]').forEach(b => b.onclick = () => {
    const r = composer.results[+b.dataset.saveOpt];
    saveRecipe({
      id: 'r' + Date.now().toString(36),
      name: r.nombre.charAt(0).toUpperCase() + r.nombre.slice(1),
      meal_type: composer.meal,
      ingredients: r.items.map(x => ({ ingredient_id: x.food.id, amount_g: x.grams })),
      is_fixed: false, tags: [], notes: r.tiempo + ' min. ' + r.pasos.join(' '),
    });
    closeSheet(); tab = 'recetas'; render();
    toast('Guardada «' + r.nombre + '»');
  });
}

/* ---- Selector de alimentos: ordenado por proteína/caloría ---- */
function sheetPicker(title, onPick) {
  const body =
    '<div class="field"><input class="input" id="pk-q" type="search" placeholder="Buscar alimento" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>' +
    '<div id="pk-list"></div>';
  openSheet(title, body, scrim => {
    const q = scrim.querySelector('#pk-q');
    const list = scrim.querySelector('#pk-list');
    const paint = term => {
      const n = norm(term);
      const items = n.length >= 2
        ? searchFoods(term, 40)
        : allFoods().slice().sort((a, b) => density(b) - density(a)).slice(0, 25);
      if (!items.length) { list.innerHTML = '<p class="empty">Sin resultados.</p>'; return; }
      list.innerHTML = (n.length >= 2 ? '' : '<span class="eyebrow">Mejor proteína por caloría</span>') +
        items.map(f =>
          '<button class="pick" data-f="' + f.id + '"><div class="info">' +
            '<span class="nm">' + esc(f.nombre) + '</span>' +
            '<span class="sub">' + f.kcal100 + ' kcal · P' + f.prot100 + ' C' + f.carbs100 +
              ' G' + f.fat100 + ' / 100 ' + (f.unit || 'g') +
              (f.tienda ? ' · ' + esc(f.tienda) : '') + '</span>' +
          '</div><span class="dens">' + (density(f) * 100).toFixed(1) + '</span></button>').join('');
      list.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
        const food = foodById(b.dataset.f);
        closeSheet();
        if (food) setTimeout(() => onPick(food), 60);
      });
    };
    paint('');
    q.addEventListener('input', () => paint(q.value.trim()));
    setTimeout(() => q.focus(), 220);
  });
}

/* ============================================================
   CONSTRUCTOR DE COMIDAS
   Buscar, añadir varios alimentos y ver macros y micros del
   conjunto sin salir de la hoja. Es la vía principal para
   registrar: lo habitual es que la comida no sea la habitual.
   ============================================================ */
let builder = null;

function sheetBuilder(mealKey) {
  builder = { meal: mealKey, items: [] };
  const body =
    '<div class="field">' +
      '<input class="input" id="bd-q" type="search" placeholder="Buscar alimento y tocar para añadir" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '</div>' +
    '<div id="bd-results"></div>' +
    '<div id="bd-items"></div>' +
    '<div id="bd-tot"></div>' +
    '<div class="field"><label for="bd-name">Guardarla también como receta (opcional)</label>' +
      '<input class="input" id="bd-name" placeholder="Nombre de la receta"></div>' +
    '<button class="btn primary wide" id="bd-save">Añadir a ' + mealName(mealKey).toLowerCase() + '</button>';

  openSheet('Montar ' + mealName(mealKey).toLowerCase(), body, scrim => {
    const q = scrim.querySelector('#bd-q');
    q.addEventListener('input', () => builderResults(q.value.trim()));
    scrim.querySelector('#bd-save').onclick = builderCommit;
    builderResults('');
    builderItems();
    setTimeout(() => q.focus(), 220);
  });
}

/* Resultados de búsqueda; se ordenan por proteína por caloría. */
function builderResults(term) {
  const box = document.getElementById('bd-results');
  if (!box) return;
  const n = norm(term);
  if (n.length < 2) {
    box.innerHTML = '<p class="hint" style="margin:0">Escribe al menos dos letras. ' +
      'Tienes ' + allFoods().length + ' alimentos, incluidos los de Mercadona, Ametller, Carrefour y Jespac.</p>';
    return;
  }
  const items = searchFoods(term, 25);
  if (!items.length) {
    box.innerHTML = '<p class="empty">Sin resultados. Puedes crearlo en Ajustes → Alimentos propios.</p>';
    return;
  }
  box.innerHTML = items.map(f =>
    '<button class="pick" data-add="' + f.id + '"><div class="info">' +
      '<span class="nm">' + esc(f.nombre) + '</span>' +
      '<span class="sub">' + f.kcal100 + ' kcal · P' + f.prot100 + ' C' + f.carbs100 + ' G' + f.fat100 +
        ' / 100 ' + (f.unit || 'g') + (f.tienda ? ' · ' + esc(f.tienda) : '') + '</span>' +
    '</div><span class="dens">+</span></button>').join('');
  box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const food = foodById(b.dataset.add);
    builder.items.push({ id: b.dataset.add, grams: defaultGrams(food) });
    const q = document.getElementById('bd-q');
    if (q) { q.value = ''; q.focus(); }
    builderResults('');
    builderItems();
  });
}

function builderTotals() {
  const t = { kcal: 0, prot: 0, carbs: 0, fat: 0, sat: 0, fiber: 0, fe: 0, ca: 0, vd: 0 };
  builder.items.forEach(it => {
    const f = foodById(it.id);
    if (!f) return;
    const m = macrosOf(f, it.grams);
    for (const k in t) t[k] += m[k];
  });
  return t;
}

/* Lista de lo añadido y totales. Los gramos se editan sin
   repintar la lista entera, para no perder el foco al teclear. */
function builderItems() {
  const box = document.getElementById('bd-items');
  if (!box || !builder) return;
  if (!builder.items.length) {
    box.innerHTML = '';
    builderTotalsBox();
    return;
  }
  box.innerHTML = '<span class="eyebrow">Tu comida</span>' +
    builder.items.map((it, idx) => {
      const f = foodById(it.id);
      return '<div class="ing-edit"><span class="nm">' + esc(f ? f.nombre : '—') + '</span>' +
        '<input type="number" inputmode="numeric" min="1" max="5000" value="' + it.grams + '" data-g="' + idx + '">' +
        '<span class="u">' + (f ? (f.unit || 'g') : 'g') + '</span>' +
        '<button class="x" data-del="' + idx + '" aria-label="Quitar">✕</button></div>';
    }).join('');
  box.querySelectorAll('[data-g]').forEach(inp => inp.oninput = () => {
    builder.items[+inp.dataset.g].grams = Math.max(1, parseInt(inp.value, 10) || 0);
    builderTotalsBox();
  });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    builder.items.splice(+b.dataset.del, 1);
    builderItems();
  });
  builderTotalsBox();
}

function builderTotalsBox() {
  const box = document.getElementById('bd-tot');
  if (!box || !builder) return;
  if (!builder.items.length) { box.innerHTML = ''; return; }
  const t = builderTotals();
  const gap = shareForMeal(curDate, builder.meal);
  const dif = Math.round(t.kcal - gap.kcal);
  box.innerHTML =
    '<div class="preview"><b>' + Math.round(t.kcal) + ' kcal</b>' +
      '<span>P ' + fmt1(t.prot) + ' g</span><span>C ' + fmt1(t.carbs) + ' g</span>' +
      '<span>G ' + fmt1(t.fat) + ' g</span><span>sat ' + fmt1(t.sat) + ' g</span></div>' +
    '<div class="micro-strip">' +
      '<span>fibra <b>' + fmt1(t.fiber) + ' g</b></span>' +
      '<span>hierro <b>' + fmt1(t.fe) + ' mg</b></span>' +
      '<span>calcio <b>' + Math.round(t.ca) + ' mg</b></span>' +
      '<span>vit D <b>' + fmt1(t.vd) + ' µg</b></span>' +
    '</div>' +
    '<p class="hint" style="margin:8px 0 0">Para ' + mealName(builder.meal).toLowerCase() +
      ' te tocaban ' + Math.max(0, Math.round(gap.kcal)) + ' kcal: ' +
      (Math.abs(dif) <= 40 ? 'encaja bien' : (dif > 0 ? dif + ' kcal por encima' : Math.abs(dif) + ' kcal por debajo')) + '.</p>';
}

/* Registra lo montado y, si le has puesto nombre, lo guarda como receta. */
function builderCommit() {
  if (!builder || !builder.items.length) { toast('Añade algún alimento primero'); return; }
  const stamp = Date.now();
  builder.items.forEach((it, i) => {
    const f = foodById(it.id);
    if (!f) return;
    const m = macrosOf(f, it.grams);
    addEntry(curDate, {
      id: 'b' + stamp + '_' + i, meal: builder.meal, nombre: f.nombre,
      qty: it.grams, unit: f.unit || 'g',
      kcal: Math.round(m.kcal), prot: round1(m.prot), carbs: round1(m.carbs),
      fat: round1(m.fat), sat: round1(m.sat), fiber: round1(m.fiber),
      fe: round1(m.fe), ca: Math.round(m.ca), vd: round1(m.vd),
      food_id: f.id,
    });
    consumeFood(f.id, it.grams);
  });

  const nameEl = document.getElementById('bd-name');
  const name = nameEl ? nameEl.value.trim() : '';
  if (name) {
    saveRecipe({
      id: 'r' + stamp.toString(36), name: name, meal_type: builder.meal,
      ingredients: builder.items.map(it => ({ ingredient_id: it.id, amount_g: it.grams })),
      is_fixed: false, tags: [], notes: '',
    });
  }
  const n = builder.items.length;
  builder = null;
  closeSheet();
  render();
  toast(name ? name + ' registrada y guardada' : n + (n === 1 ? ' alimento añadido' : ' alimentos añadidos'));
}

/* ---- Cambiar una comida del menú ---- */
function sheetSwap(date, mealKey) {
  const ws = menuWeek || weekStartOf(today());
  const menu = getMenu(ws);
  if (!menu) return;
  const day = menu.days.find(d => d.date === date);
  if (!day) return;
  const gap = slotGap(day, mealKey);

  const options = recipesFor(mealKey)
    .filter(r => postWorkoutOk(r, date))
    .map(r => {
      const factor = fitFactor(r, gap);
      const adj = scaleRecipe(r, factor);
      const s = scoreRecipe(adj, gap, { fatLeft: gap.fat });
      return { r: r, factor: factor, macros: adj.macros, raw: s.raw };
    })
    .sort((a, b) => b.raw - a.raw);
  const best = options.length ? Math.max(options[0].raw, 1) : 1;

  const body =
    '<p class="hint" style="margin:0">Al día le quedan <span class="num">' + Math.round(gap.kcal) +
      '</span> kcal y <span class="num">' + Math.round(gap.prot) + '</span> g de proteína con las demás comidas puestas.</p>' +
    '<div>' + options.map(o =>
      '<button class="pick" data-s="' + o.r.id + '"><div class="info">' +
        '<span class="nm">' + esc(o.r.name) + (o.factor !== 1 ? ' <span class="faint">×' + o.factor + '</span>' : '') + '</span>' +
        '<span class="sub">' + o.macros.kcal + ' kcal · P' + fmt1(o.macros.prot) +
          ' C' + fmt1(o.macros.carbs) + ' G' + fmt1(o.macros.fat) + '</span>' +
      '</div><span class="dens">' + Math.max(1, Math.round((o.raw / best) * 100)) + '</span></button>').join('') + '</div>';

  openSheet(mealName(mealKey) + ' · ' + dayName(date) + ' ' + shortDate(date), body, scrim => {
    scrim.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      const r = recipeById(b.dataset.s);
      const slot = day.meal_slots.find(s => s.meal_type === mealKey);
      const factor = r ? fitFactor(r, gap) : 1;
      if (slot) { slot.recipe_id = b.dataset.s; slot.factor = factor; }
      else day.meal_slots.push({ meal_type: mealKey, recipe_id: b.dataset.s, factor: factor, is_locked: false });
      setMenu(menu);
      closeSheet(); render(); toast('Comida cambiada');
    });
  });
}

/* ---- Ajustes: objetivos, tema, copia de seguridad ---- */
function sheetSettings() {
  const t = targets();
  const fromMacros = kcalFromMacros(t);
  const off = fromMacros - t.kcal;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  const body =
    '<div><span class="eyebrow">Objetivos diarios</span>' +
    '<p class="hint" style="margin:6px 0 10px">Fijos: no cambian según el día. La proteína es un piso; ' +
      'carbos y grasa son la variable de ajuste.</p>' +
    '<div class="grid2">' +
      '<div class="field"><label for="tg-kcal">Calorías</label><input class="input numeric" id="tg-kcal" type="number" inputmode="numeric" value="' + t.kcal + '"></div>' +
      '<div class="field"><label for="tg-prot">Proteína · piso</label><input class="input numeric" id="tg-prot" type="number" inputmode="numeric" value="' + t.protein + '"></div>' +
      '<div class="field"><label for="tg-carbs">Carbohidratos</label><input class="input numeric" id="tg-carbs" type="number" inputmode="numeric" value="' + t.carbs + '"></div>' +
      '<div class="field"><label for="tg-fat">Grasa</label><input class="input numeric" id="tg-fat" type="number" inputmode="numeric" value="' + t.fat + '"></div>' +
    '</div>' +
    (Math.abs(off) > 30 ? '<div class="note warn" style="margin-top:10px"><i class="bar"></i><div>' +
      '<b>Los macros no cuadran con las kcal</b><span>Suman ' + fromMacros + ' kcal, ' + Math.abs(off) +
      ' ' + (off > 0 ? 'por encima' : 'por debajo') + ' del objetivo. Recalcula para cuadrarlos sin tocar la proteína.</span></div></div>' : '') +
    '<p class="hint">Saturadas máximo <span class="num">' + satLimit(t) + '</span> g, el 20 % del objetivo de grasa. ' +
      'Aviso por debajo de ' + RULES.kcalMin + ' kcal.</p>' +
    '<div style="display:flex;flex-direction:column;gap:7px">' +
      '<button class="btn primary wide" data-tg-save>Guardar objetivos</button>' +
      '<button class="btn wide" data-tg-bal>Recalcular carbos y grasa</button>' +
      (targetsAreCustom() ? '<button class="btn wide" data-tg-reset>Volver a los originales</button>' : '') +
    '</div></div>' +

    '<div><span class="eyebrow">Aspecto</span>' +
      '<label class="checkline" style="margin-top:8px"><input type="checkbox" id="dark-toggle"' +
      (isDark ? ' checked' : '') + '><span>Forzar modo oscuro</span></label>' +
      '<p class="hint" style="margin:4px 0 0">Sin marcar sigue el tema de tu móvil.</p></div>' +

    '<div><span class="eyebrow">Copia de seguridad</span>' +
      '<p class="hint" style="margin:6px 0 8px">Los datos viven solo en este navegador. Copia el texto y guárdalo ' +
        'donde quieras; para restaurar, pégalo aquí y toca Restaurar.</p>' +
      '<textarea class="ta" id="bk" rows="4" placeholder="Pega aquí una copia para restaurar"></textarea>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn grow" data-bk-out>Copiar mis datos</button>' +
        '<button class="btn grow" data-bk-in>Restaurar</button>' +
      '</div></div>' +

    '<div><span class="eyebrow">Alimentos propios</span>' +
      '<button class="btn wide" style="margin-top:8px" data-newfood>Crear un alimento</button></div>';

  openSheet('Ajustes', body, scrim => {
    const num = id => parseInt(scrim.querySelector('#' + id).value, 10);
    scrim.querySelector('[data-tg-save]').onclick = () => {
      const k = num('tg-kcal'), p = num('tg-prot'), c = num('tg-carbs'), f = num('tg-fat');
      if (!k || !p || !c || !f) { toast('Rellena los cuatro valores'); return; }
      saveTargets({ kcal: k, protein: p, carbs: c, fat: f });
      closeSheet(); render(); toast('Objetivos actualizados');
    };
    scrim.querySelector('[data-tg-bal]').onclick = () => {
      const next = rebalance(num('tg-kcal') || t.kcal, num('tg-prot') || t.protein);
      saveTargets(next);
      closeSheet(); render();
      toast('Ahora ' + next.carbs + ' g de carbos y ' + next.fat + ' g de grasa');
    };
    const reset = scrim.querySelector('[data-tg-reset]');
    if (reset) reset.onclick = () => { DB.del('targets'); closeSheet(); render(); toast('Objetivos originales'); };

    scrim.querySelector('#dark-toggle').onchange = ev => {
      if (ev.target.checked) { document.documentElement.setAttribute('data-theme', 'dark'); DB.set('theme', 'dark'); }
      else { document.documentElement.removeAttribute('data-theme'); DB.del('theme'); }
    };

    scrim.querySelector('[data-bk-out]').onclick = () => {
      const dump = {};
      DB.keys().forEach(k => { dump[k] = DB.get(k, null); });
      const text = JSON.stringify({ app: 'nutricion-sol', at: new Date().toISOString(), data: dump });
      const ta = scrim.querySelector('#bk');
      ta.value = text; ta.focus(); ta.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (e) {}
      toast(copied ? 'Datos copiados al portapapeles' : 'Datos listos: cópialos del cuadro');
    };
    scrim.querySelector('[data-bk-in]').onclick = () => {
      const raw = scrim.querySelector('#bk').value.trim();
      if (!raw) { toast('Pega primero una copia'); return; }
      try {
        const parsed = JSON.parse(raw);
        const data = parsed.data || parsed;
        let n = 0;
        Object.keys(data).forEach(k => { if (DB.set(k, data[k])) n++; });
        invalidateFoods();
        closeSheet(); render();
        toast('Restaurados ' + n + ' registros');
      } catch (e) { toast('Esa copia no se entiende: revisa el texto'); }
    };

    scrim.querySelector('[data-newfood]').onclick = () => { closeSheet(); setTimeout(sheetNewFood, 240); };
  });
}

/* ---- Crear un alimento propio ---- */
function sheetNewFood() {
  const body =
    '<p class="hint" style="margin:0">Valores por 100 g o 100 ml, como vienen en la etiqueta.</p>' +
    '<div class="field"><label for="nf-n">Nombre</label><input class="input" id="nf-n" placeholder="Carrot cake proteico"></div>' +
    '<div class="grid2">' +
      '<div class="field"><label for="nf-k">Calorías</label><input class="input numeric" id="nf-k" type="number" inputmode="numeric"></div>' +
      '<div class="field"><label for="nf-p">Proteína g</label><input class="input numeric" id="nf-p" type="number" inputmode="numeric"></div>' +
      '<div class="field"><label for="nf-c">Carbos g</label><input class="input numeric" id="nf-c" type="number" inputmode="numeric"></div>' +
      '<div class="field"><label for="nf-f">Grasa g</label><input class="input numeric" id="nf-f" type="number" inputmode="numeric"></div>' +
      '<div class="field"><label for="nf-s">Saturadas g</label><input class="input numeric" id="nf-s" type="number" inputmode="numeric"></div>' +
      '<div class="field"><label for="nf-b">Fibra g</label><input class="input numeric" id="nf-b" type="number" inputmode="numeric"></div>' +
    '</div>' +
    '<button class="btn primary wide" data-nf-save>Guardar alimento</button>';
  openSheet('Nuevo alimento', body, scrim => {
    scrim.querySelector('[data-nf-save]').onclick = () => {
      const v = id => parseFloat(scrim.querySelector('#' + id).value);
      const name = scrim.querySelector('#nf-n').value.trim();
      const kcal = v('nf-k');
      if (!name || isNaN(kcal)) { toast('Hacen falta el nombre y las calorías'); return; }
      const food = {
        id: 'c' + Date.now().toString(36), cat: 'Míos', nombre: name, unit: 'g',
        kcal100: kcal,
        prot100: isNaN(v('nf-p')) ? 0 : v('nf-p'),
        carbs100: isNaN(v('nf-c')) ? 0 : v('nf-c'),
        fat100: isNaN(v('nf-f')) ? 0 : v('nf-f'),
        sat100: isNaN(v('nf-s')) ? 0 : v('nf-s'),
        fiber100: isNaN(v('nf-b')) ? 0 : v('nf-b'),
      };
      const own = DB.get('foods', []); own.push(food); DB.set('foods', own);
      invalidateFoods();
      closeSheet(); toast(name + ' guardado');
    };
  });
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('.tab');
  if (!b) return;
  tab = b.dataset.tab;
  suggestMeal = null;
  render();
});
document.getElementById('gear').addEventListener('click', sheetSettings);

document.getElementById('view').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act], #trained-toggle');
  if (!el) return;

  if (el.id === 'trained-toggle') {
    const now = !trainedOn(curDate);
    setTrained(curDate, now);
    render();
    toast(now ? 'Entreno marcado: ya puedes usar la Evolate' : 'Entreno desmarcado');
    return;
  }

  const act = el.dataset.act;
  const d = el.dataset;

  if (act === 'day') {
    const next = shiftDate(curDate, parseInt(d.d, 10));
    if (next <= today()) { curDate = next; suggestMeal = null; render(); }
    return;
  }
  if (act === 'suggest') { tab = 'hoy'; suggestMeal = d.meal; render(); return; }
  if (act === 'recipe') { sheetRecipe(d.id); return; }
  if (act === 'log-sug') {
    const r = recipeById(d.id);
    if (r) logRecipe(r, parseFloat(d.f) || 1, d.meal);
    return;
  }
  if (act === 'log-ing') {
    const food = foodById(d.id);
    if (!food) return;
    const grams = parseInt(d.g, 10) || 100;
    const m = macrosOf(food, grams);
    const meal = suggestMeal || pendingMeals(curDate)[0] || 'cena';
    addEntry(curDate, {
      id: 'e' + Date.now(), meal: meal, nombre: food.nombre,
      qty: grams, unit: food.unit || 'g',
      kcal: Math.round(m.kcal), prot: round1(m.prot), carbs: round1(m.carbs),
      fat: round1(m.fat), sat: round1(m.sat), fiber: round1(m.fiber),
      fe: round1(m.fe), ca: Math.round(m.ca), vd: round1(m.vd),
      food_id: food.id,
    });
    consumeFood(food.id, grams);
    render();
    toast(grams + ' ' + (food.unit || 'g') + ' de ' + food.nombre);
    return;
  }
  if (act === 'add-food') { sheetBuilder(d.meal); return; }
  if (act === 'del-entry') { removeEntry(curDate, d.id); render(); return; }
  if (act === 'rfilter') { recipeFilter = d.f; render(); return; }
  if (act === 'new-recipe') { sheetEditor(null); return; }
  if (act === 'composer') { sheetComposer(recipeFilter === 'todas' ? 'desayuno' : recipeFilter); return; }
  if (act === 'week') {
    const base = menuWeek || weekStartOf(today());
    menuWeek = shiftDate(base, parseInt(d.d, 10));
    render();
    return;
  }
  if (act === 'gen-menu') {
    const ws = menuWeek || weekStartOf(today());
    generateMenu(ws);
    render();
    toast('Menú de 7 días listo');
    return;
  }
  if (act === 'swap') { sheetSwap(d.date, d.meal); return; }
  if (act === 'lock') {
    const ws = menuWeek || weekStartOf(today());
    const menu = getMenu(ws);
    if (!menu) return;
    const day = menu.days.find(x => x.date === d.date);
    const slot = day && day.meal_slots.find(s => s.meal_type === d.meal);
    if (slot) { slot.is_locked = !slot.is_locked; setMenu(menu); render(); }
    return;
  }
  if (act === 'go-shop') {
    tab = 'compra';
    render();
    const s = document.getElementById('shop');
    if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (act === 'load-shopping') { sheetLoadShopping(); return; }
  if (act === 'shop-store') { shopStore = d.s; render(); return; }
  if (act === 'set-store') { sheetStorePicker(d.id); return; }
  if (act === 'pantry-meal') { nutMealForPantry = d.meal; render(); return; }
  if (act === 'log-pantry-recipe') {
    const r = pantryRecipes[+d.i];
    if (!r) return;
    const stamp = Date.now();
    r.items.forEach((x, i) => {
      const m = macrosOf(x.food, x.grams);
      addEntry(curDate, {
        id: 'p' + stamp + '_' + i, meal: nutMealForPantry, nombre: x.food.nombre,
        qty: x.grams, unit: x.food.unit || 'g',
        kcal: Math.round(m.kcal), prot: round1(m.prot), carbs: round1(m.carbs),
        fat: round1(m.fat), sat: round1(m.sat), fiber: round1(m.fiber),
        fe: round1(m.fe), ca: Math.round(m.ca), vd: round1(m.vd),
        food_id: x.food.id,
      });
      consumeFood(x.food.id, x.grams);
    });
    tab = 'hoy'; render();
    toast('Registrado en ' + mealName(nutMealForPantry).toLowerCase());
    return;
  }
  if (act === 'pan-add') {
    sheetPicker('Añadir a la despensa', food => {
      savePantry({ ingredient_id: food.id, estimated_quantity: 500, last_purchased: today() });
      render();
      toast(food.nombre + ' en la despensa');
    });
    return;
  }
  if (act === 'pan') {
    savePantry({ ingredient_id: d.id, estimated_quantity: Math.max(0, pantryQty(d.id) + parseInt(d.d, 10)) });
    render();
    return;
  }
  if (act === 'pan-del') { removePantry(d.id); render(); return; }
  if (act === 'check') {
    const ws = menuWeek || weekStartOf(today());
    const list = DB.get('shop_' + ws, []);
    const i = list.indexOf(d.id);
    if (i >= 0) list.splice(i, 1); else list.push(d.id);
    DB.set('shop_' + ws, list);
    render();
    return;
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
});

/* ============================================================
   ARRANQUE
   ============================================================ */
if (DB.get('theme', null) === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
render();
</script>
