<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutrición">
<meta name="description" content="App personal de nutrición: objetivos fijos, recetas, menú semanal y lista de la compra.">
<title>Nutrición · Sol</title>
</head>
<body>
<style>
/* ============================================================
   Identidad: azul de loza sobre papel cálido.
   Sans del sistema para el idioma, monoespaciada tabular para
   cada gramo — la app es un instrumento de medida, no una red.
   ============================================================ */
:root {
  color-scheme: light;
  --ground:        #F7F6F2;
  --surface:       #FFFFFF;
  --sunken:        #ECEAE3;
  --line:          #E3E0D7;
  --line-soft:     #EFEDE6;

  --ink:           #1C2429;
  --ink-soft:      #5C686E;
  --ink-faint:     #939EA4;

  --accent:        #1F5673;
  --accent-ink:    #FFFFFF;
  --accent-wash:   #E9F0F4;
  --accent-line:   #C4D8E3;

  --good:          #3F7D5A;
  --good-wash:     #E7F1EB;
  --warn:          #A8760F;
  --warn-wash:     #F7EFDD;
  --crit:          #A8443A;
  --crit-wash:     #F7E8E6;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --r-lg: 14px;
  --r-md: 10px;
  --r-sm: 7px;
  --shadow: 0 1px 2px rgba(28,36,41,.06), 0 4px 14px rgba(28,36,41,.05);
  --shadow-up: 0 -1px 0 var(--line), 0 -8px 24px rgba(28,36,41,.06);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #14181B;
    --surface:     #1C2227;
    --sunken:      #262E34;
    --line:        #2E373D;
    --line-soft:   #242C31;

    --ink:         #E9EBE7;
    --ink-soft:    #9CA7AD;
    --ink-faint:   #6A757B;

    --accent:      #79ADCB;
    --accent-ink:  #0F1418;
    --accent-wash: #1B2C37;
    --accent-line: #2C4655;

    --good:        #63AC80;
    --good-wash:   #1A2A22;
    --warn:        #D2A244;
    --warn-wash:   #2C2517;
    --crit:        #D4756C;
    --crit-wash:   #2E1D1B;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-up: 0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #14181B;
  --surface:     #1C2227;
  --sunken:      #262E34;
  --line:        #2E373D;
  --line-soft:   #242C31;

  --ink:         #E9EBE7;
  --ink-soft:    #9CA7AD;
  --ink-faint:   #6A757B;

  --accent:      #79ADCB;
  --accent-ink:  #0F1418;
  --accent-wash: #1B2C37;
  --accent-line: #2C4655;

  --good:        #63AC80;
  --good-wash:   #1A2A22;
  --warn:        #D2A244;
  --warn-wash:   #2C2517;
  --crit:        #D4756C;
  --crit-wash:   #2E1D1B;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-up: 0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---- Estructura ---- */
.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--ground);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 14px 18px 10px;
  padding-top: calc(14px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 640;
  letter-spacing: -0.01em;
}
.topbar .when {
  flex: 1;
  font-size: 12px;
  color: var(--ink-faint);
  font-family: var(--mono);
}
.icon-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 14px;
  align-self: center;
}
.icon-btn:active { background: var(--sunken); }

main { flex: 1; padding: 14px 18px 96px; display: flex; flex-direction: column; gap: 14px; }

.tabs {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  max-width: 460px;
  margin: 0 auto;
  background: var(--surface);
  box-shadow: var(--shadow-up);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  border: 0; background: none;
  min-height: 48px;
  padding: 10px 4px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-faint);
  font-size: 10.5px; font-weight: 600;
  letter-spacing: .02em;
  border-top: 2px solid transparent;
}
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
.tab svg { width: 19px; height: 19px; }

/* ---- Piezas ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 15px;
  box-shadow: var(--shadow);
}
.eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.section-head {
  display: flex; align-items: baseline; gap: 8px;
  margin-top: 4px;
}
.section-head h2 { margin: 0; font-size: 13px; font-weight: 660; letter-spacing: -.005em; }
.section-head .rest { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }

/* ---- Lectura principal: lo que FALTA ---- */
.readout { display: flex; flex-direction: column; gap: 2px; }
.readout-figure {
  display: flex; align-items: baseline; gap: 8px;
  margin: 2px 0 12px;
}
.readout-figure .big {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 50px;
  font-weight: 550;
  letter-spacing: -.035em;
  line-height: 1;
  color: var(--accent);
}
.readout-figure .unit { font-size: 13px; color: var(--ink-faint); font-weight: 600; }
.readout.over .big { color: var(--crit); }
.readout.done .big { color: var(--good); }

.ledger { display: flex; flex-direction: column; gap: 9px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.ledger-row { display: grid; grid-template-columns: 62px 1fr 84px; align-items: center; gap: 9px; }
.ledger-row .k { font-size: 11.5px; color: var(--ink-soft); font-weight: 560; }
.ledger-row .v { font-size: 11.5px; text-align: right; color: var(--ink); }
.ledger-row .v small { color: var(--ink-faint); }
.rail { height: 4px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.rail > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .45s ease; }
.rail > i.good { background: var(--good); }
.rail > i.warn { background: var(--warn); }
.rail > i.crit { background: var(--crit); }

.trained {
  display: flex; align-items: center; gap: 9px;
  margin-top: 12px; padding-top: 11px;
  border-top: 1px solid var(--line-soft);
  font-size: 12px; color: var(--ink-soft);
}
.switch {
  /* El botón mide 44px de alto para el pulgar; la vía se dibuja dentro
     con la medida nativa de iOS (51x31). Un pseudo-elemento que
     sobresale de un <button> no recibe los toques, así que la zona
     táctil tiene que ser el propio botón. */
  margin-left: auto;
  position: relative;
  width: 51px; height: 44px;
  border: 0; background: none; padding: 0;
  flex: 0 0 51px;
}
.switch::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 51px; height: 31px; margin-top: -15.5px;
  border-radius: 16px;
  background: var(--sunken); border: 1px solid var(--line);
  transition: background .2s, border-color .2s;
}
.switch::after {
  content: ""; position: absolute; left: 3px; top: 50%;
  width: 25px; height: 25px; margin-top: -12.5px;
  border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25);
  transition: transform .2s;
}
.switch[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.switch[aria-pressed="true"]::after { transform: translateX(20px); }

/* ---- Avisos ---- */
.notes { display: flex; flex-direction: column; gap: 7px; }
.note {
  display: flex; gap: 9px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 12.5px;
}
.note .bar { width: 3px; border-radius: 2px; flex: 0 0 3px; background: var(--ink-faint); }
.note b { display: block; font-weight: 620; font-size: 12.5px; }
.note span { color: var(--ink-soft); font-size: 11.5px; }
.note.info { background: var(--accent-wash); border-color: var(--accent-line); }
.note.info .bar { background: var(--accent); }
.note.warn { background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.note.warn .bar { background: var(--warn); }
.note.crit { background: var(--crit-wash); border-color: color-mix(in srgb, var(--crit) 30%, transparent); }
.note.crit .bar { background: var(--crit); }

/* ---- Chips ---- */
.chips { display: flex; gap: 5px; }
.chip {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  border-radius: 999px;
  min-height: 44px;
  padding: 6px 4px;
  font-size: 11.5px; font-weight: 600;
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: 0 0 auto; padding: 6px 12px; }

/* ---- Sugerencias ---- */
.hint { font-size: 11.5px; color: var(--ink-faint); margin: 9px 0 10px; }
.sugs { display: flex; flex-direction: column; gap: 9px; }
.sug { border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px; background: var(--surface); }
.sug-top { display: flex; align-items: flex-start; gap: 8px; }
.sug-name { flex: 1; font-size: 13.5px; font-weight: 620; line-height: 1.3; text-wrap: balance; }
.fit {
  flex: 0 0 auto;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  color: var(--accent); background: var(--accent-wash);
  border: 1px solid var(--accent-line);
  border-radius: 999px; padding: 1px 7px;
}
.macro-row {
  display: flex; flex-wrap: wrap; gap: 4px 10px;
  margin-top: 6px;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 11.5px; color: var(--ink-soft);
}
.macro-row b { color: var(--ink); font-weight: 620; }
.pill {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  background: var(--sunken); color: var(--ink-soft);
  border-radius: 999px; padding: 1px 7px;
}
.why { font-size: 11.5px; margin-top: 6px; color: var(--good); }
.careful { font-size: 11.5px; margin-top: 4px; color: var(--warn); }
.sug-actions { display: flex; gap: 6px; margin-top: 10px; }
.btn {
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 12px;
  /* 44px es la zona táctil mínima cómoda para el pulgar */
  min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 620;
}
.btn:active { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.grow { flex: 1; }
.btn.wide { width: 100%; }
.btn.danger { color: var(--crit); }
.btn.small { padding: 6px 10px; font-size: 13px; min-width: 44px; }

.ing-close { margin-top: 12px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
.ing-row {
  display: flex; align-items: baseline; gap: 9px;
  width: 100%; text-align: left; min-height: 44px;
  border: 0; border-bottom: 1px solid var(--line-soft);
  background: none; padding: 10px 0;
}
.ing-row:last-child { border-bottom: 0; }
.ing-row .n { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ing-row .g { font-family: var(--mono); font-size: 12.5px; font-weight: 620; color: var(--accent); }
.ing-row .m { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); min-width: 92px; text-align: right; }

/* ---- Comidas del día ---- */
.meal { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.meal + .meal { margin-top: 8px; }
.meal-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px; }
.meal-name { font-size: 13px; font-weight: 620; }
.meal-kcal { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.mini {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; line-height: 1; padding: 0;
  position: relative;
}
/* El objetivo táctil llega a 44px sin agrandar el botón a la vista */
.mini::after { content: ""; position: absolute; inset: -5px; }
.mini.accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
.entries { border-top: 1px solid var(--line-soft); }
.entry { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.entry:last-child { border-bottom: 0; }
.entry .info { flex: 1; min-width: 0; }
.entry .nm { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .qt { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.entry .kc { font-family: var(--mono); font-size: 12px; font-weight: 620; }
.x {
  border: 0; background: none; color: var(--ink-faint);
  font-size: 15px; line-height: 1;
  min-width: 44px; min-height: 44px; padding: 0;
}
.x:active { color: var(--crit); }

/* ---- Recetas ---- */
.rec { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 12px; }
.rec + .rec { margin-top: 8px; }
.rec-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.rec-name { flex: 1; font-size: 13.5px; font-weight: 620; min-width: 0; text-wrap: balance; }
.tag {
  font-size: 9.5px; font-weight: 680; text-transform: uppercase; letter-spacing: .06em;
  padding: 2px 6px; border-radius: 4px; background: var(--sunken); color: var(--ink-soft);
}
.tag.fixed { background: var(--accent-wash); color: var(--accent); }
.tag.blue { background: var(--good-wash); color: var(--good); }
.rec-foot { margin-top: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }

/* ---- Menú ---- */
.weeknav { display: flex; align-items: center; gap: 10px; }
.weeknav .lbl { flex: 1; text-align: center; font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.day { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.day + .day { margin-top: 8px; }
.day.today { border-color: var(--accent); }
.day-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
.day-name { font-size: 12.5px; font-weight: 660; text-transform: capitalize; }
.day-tot { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.day-tot .ok { color: var(--good); }
.day-tot .no { color: var(--warn); }
.slot { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.slot:last-child { border-bottom: 0; }
.slot-key { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); width: 38px; flex: 0 0 38px; }
.slot-body { flex: 1; min-width: 0; min-height: 44px; border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; justify-content: center; }
.slot-name { display: block; font-size: 12.5px; font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-macros { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.lock { border: 0; background: none; font-size: 14px; min-width: 44px; min-height: 44px; padding: 0; opacity: .3; }
.lock[aria-pressed="true"] { opacity: 1; }

/* ---- Despensa y compra ---- */
.prow { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.prow:last-child { border-bottom: 0; }
.prow .info { flex: 1; min-width: 0; }
.prow .nm { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sub { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.stepper { display: flex; align-items: center; gap: 3px; }
.cook { width: 100%; min-height: 44px; text-align: left; border: 0; background: none; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.cook:last-child { border-bottom: 0; }
.cook .bar2 { height: 3px; background: var(--sunken); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.cook .bar2 > i { display: block; height: 100%; background: var(--good); }
.cook .nm { font-size: 12.5px; font-weight: 560; }
.cook .sub { font-size: 10.5px; color: var(--ink-faint); }
.shop-group + .shop-group { margin-top: 12px; }
.shop-cat { font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px; }
.shop {
  display: flex; align-items: center; gap: 9px; width: 100%; min-height: 44px;
  text-align: left; border: 0; background: none;
  padding: 8px 0; border-bottom: 1px solid var(--line-soft);
}
.shop:last-child { border-bottom: 0; }
.shop .box { width: 15px; height: 15px; border: 1.5px solid var(--line); border-radius: 4px; flex: 0 0 15px; display: grid; place-items: center; font-size: 10px; color: var(--accent-ink); }
.shop[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.shop[aria-pressed="true"] .nm { text-decoration: line-through; color: var(--ink-faint); }
.shop .nm { flex: 1; font-size: 12.5px; min-width: 0; }
.shop .qt { font-family: var(--mono); font-size: 12px; font-weight: 620; text-align: right; }
.shop .qt .eur { display: block; font-size: 10.5px; font-weight: 500; color: var(--ink-faint); }

/* ---- Hojas (modales) ---- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(16,22,26,.42);
  opacity: 0; transition: opacity .22s ease;
  display: flex; align-items: flex-end; justify-content: center;
}
.scrim.on { opacity: 1; }
.sheet {
  width: 100%; max-width: 460px;
  max-height: 88dvh;
  background: var(--ground);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  display: flex; flex-direction: column;
  transform: translateY(14px); transition: transform .22s ease;
  overflow: hidden;
}
.scrim.on .sheet { transform: translateY(0); }
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px 11px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.sheet-head h3 { margin: 0; flex: 1; font-size: 14.5px; font-weight: 660; }
.sheet-body {
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 14px 18px calc(24px + env(safe-area-inset-bottom));

/* ============================================================
   ALMACENAMIENTO — todo local, en este navegador
   ============================================================ */
const DB = {
  get(k, fb) {
    try { const v = localStorage.getItem('nut_' + k); return v ? JSON.parse(v) : fb; }
    catch (e) { return fb; }
  },
  set(k, v) {
    try { localStorage.setItem('nut_' + k, JSON.stringify(v)); return true; }
    catch (e) { toast('No se pudo guardar: almacenamiento lleno'); return false; }
  },
  del(k) { try { localStorage.removeItem('nut_' + k); } catch (e) {} },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('nut_') === 0) out.push(k.slice(4));
      }
    } catch (e) {}
    return out;
  },
};

/* ---- Objetivos: se editan en un solo sitio ---- */
function targets() {
  const saved = DB.get('targets', null) || {};
  const t = Object.assign({}, DEFAULT_TARGETS, saved);
  return {
    kcal:    Number(t.kcal)    || DEFAULT_TARGETS.kcal,
    protein: Number(t.protein) || DEFAULT_TARGETS.protein,
    carbs:   Number(t.carbs)   || DEFAULT_TARGETS.carbs,
    fat:     Number(t.fat)     || DEFAULT_TARGETS.fat,
  };
}
function saveTargets(patch) { DB.set('targets', Object.assign(targets(), patch)); }
function targetsAreCustom() {
  const t = targets();
  return Object.keys(DEFAULT_TARGETS).some(k => t[k] !== DEFAULT_TARGETS[k]);
}
function satLimit(t) { return round1((t || targets()).fat * RULES.satPctOfFat); }
function kcalFromMacros(t) {
  const x = t || targets();
  return Math.round(x.protein * 4 + x.carbs * 4 + x.fat * 9);
}
/* Recalcula CH y grasa dejando la proteína intacta (es un piso). */
function rebalance(kcal, protein, fatShare) {
  fatShare = fatShare == null ? 0.35 : fatShare;
  const left = Math.max(0, kcal - protein * 4);
  const fatKcal = left * fatShare;
  return {
    kcal: kcal, protein: protein,
    fat: Math.round(fatKcal / 9),
    carbs: Math.round((left - fatKcal) / 4),
  };
}

/* ---- Alimentos ---- */
let foodIndex = null;
function allFoods() { return FOODS.concat(DB.get('foods', [])); }
function foodById(id) {
  if (!foodIndex) { foodIndex = {}; allFoods().forEach(f => { foodIndex[f.id] = f; }); }
  return foodIndex[id] || null;
}
function invalidateFoods() { foodIndex = null; }
/* Densidad proteica: criterio de ORDEN al sugerir, nunca filtro. */
function density(food) { return (food && food.kcal100) ? food.prot100 / food.kcal100 : 0; }
function macrosOf(food, grams) {
  const f = (grams || 0) / 100;
  return {
    kcal: (food.kcal100 || 0) * f, prot: (food.prot100 || 0) * f,
    carbs: (food.carbs100 || 0) * f, fat: (food.fat100 || 0) * f,
    sat: (food.sat100 || 0) * f, fiber: (food.fiber100 || 0) * f,
    fe: (food.fe100 || 0) * f, ca: (food.ca100 || 0) * f, vd: (food.vd100 || 0) * f,
  };
}
function foodHasTag(f, tag) { return !!(f && f.tags && f.tags.indexOf(tag) >= 0); }

/* Nombre corto para los chips: la marca no ayuda a reconocerlo y sí
   ocupa media fila. El nombre completo sigue en la receta y la búsqueda. */
const MARCAS = /\s+(Hacendado|Carrefour( Bio)?|Alteza|Selex|MyProtein|Ametller Origen|La Sirena|Fresc de Mercat|Quaker)\b.*$/i;
function shortName(f) {
  if (!f) return '';
  return f.nombre.replace(MARCAS, '').replace(/\s*\([^)]*\)/g, '').trim() || f.nombre;
}

/* Relevancia al BUSCAR. Dos reglas:
   - Se busca por palabras sueltas, no como una frase literal. "pan
     integral" tiene que encontrar "Pan de molde integral"; exigir que
     las palabras vayan juntas y en ese orden deja fuera casi todo.
   - Manda parecerse a lo escrito, no la densidad proteica: quien
     escribe "huevo" quiere el huevo, no la clara en polvo. */
/* Quita la marca de plural para que "huevos" encuentre "Huevo entero" y
   "arandano" encuentre "Arándanos". Solo en palabras largas, para no
   destrozar las cortas. */
function stem(w) { return w.length > 4 ? w.replace(/(es|s)$/, '') : w; }
function stemmedName(f) {
  if (f._stem) return f._stem;
  const v = norm(f.nombre).split(/\s+/).map(stem).join(' ');
  try { Object.defineProperty(f, '_stem', { value: v, enumerable: false }); } catch (e) {}
  return v;
}

/* Una palabra completa vale mucho más que un trozo de otra: "pan" es
   Pan integral, no Panga ni Panceta. */
function wordScore(name, w) {
  const pos = name.indexOf(w);
  if (pos < 0) return -1;
  if (name === w) return 100;
  const abre = pos === 0 || name[pos - 1] === ' ' || name[pos - 1] === '(';
  const cierra = pos + w.length >= name.length || /[\s),./%-]/.test(name[pos + w.length]);
  if (abre && cierra) return pos === 0 ? 90 : 70;   // palabra entera
  if (abre) return pos === 0 ? 45 : 35;             // empieza igual pero sigue
  return 20;                                        // dentro de otra palabra
}
/* Los nombres se guardan en castellano, pero se busca como se habla: la
   proteína es «de suero» en el bote y «whey» cuando la buscas. El alias
   solo sirve para encontrar el producto; no se enseña en ningún sitio. */
function aliasName(f) {
  if (!f.alias) return '';
  if (f._alias) return f._alias;
  const v = norm(f.alias).split(/\s+/).map(stem).join(' ');
  try { Object.defineProperty(f, '_alias', { value: v, enumerable: false }); } catch (e) {}
  return v;
}

function searchScore(food, palabras) {
  const name = norm(food.nombre);
  const raiz = stemmedName(food);
  const ali = aliasName(food);
  let total = 0;
  for (const w of palabras) {
    let s = wordScore(name, w);
    if (s < 0) s = wordScore(raiz, stem(w));      // misma consideración por raíz
    if (s < 0 && ali) s = wordScore(ali, stem(w)) - 10;  // por alias, pero detrás
    if (s < 0) return -1;             // todas las palabras deben aparecer
    total += s;
  }
  let score = total / palabras.length;
  // Un nombre corto suele ser el alimento base; los largos son variantes
  score -= Math.min(18, name.length / 6);
  if (/polvo|desecad|deshidrat/.test(name)) score -= 12;
  // Si no pides una preparación concreta, se entiende el alimento tal cual:
  // quien escribe "huevos" quiere el huevo, no el huevo cocido.
  const prep = /cocid|asad|frit|ahumad|almibar|congelad|en vinagre|braseado|horno|plancha/;
  if (prep.test(name) && !palabras.some(w => prep.test(w))) score -= 6;
  // "Arroz CON leche" es un plato, no el arroz. Si buscas el ingrediente,
  // lo compuesto va detrás.
  if (palabras.some(w => name.indexOf(w + ' con ') === 0)) score -= 14;
  return score + density(food) * 8;
}
function searchFoods(term, limit) {
  const palabras = norm(term).split(/\s+/).filter(w => w.length >= 2);
  if (!palabras.length) return [];
  return allFoods()
    .map(f => ({ f: f, s: searchScore(f, palabras) }))
    .filter(x => x.s >= 0)
    .sort((a, b) => b.s - a.s)
    .slice(0, limit || 25)
    .map(x => x.f);
}

/* Cantidad inicial razonable: una unidad si la tiene, poca cantidad si
   es muy calórico (aceites, polvos), y 100 g en el resto. */
function defaultGrams(food) {
  if (food.racion_g) return food.racion_g;          // ración marcada a mano
  if (food.cat === 'Platos') return 250;            // un plato, no una cucharada
  if (food.peso_ud_g) return food.peso_ud_g;
  if (food.kcal100 >= 500) return 15;
  if (food.kcal100 >= 300) return 40;
  return 100;
}

/* ---- Recetas ---- */
function recipeMacros(r) {
  const t = { kcal: 0, prot: 0, carbs: 0, fat: 0, sat: 0, fiber: 0, fe: 0, ca: 0, vd: 0 };
  (r.ingredients || []).forEach(i => {
    const f = foodById(i.ingredient_id);
    if (!f) return;
    const m = macrosOf(f, i.amount_g);
    for (const k in t) t[k] += m[k];
  });
  for (const k in t) t[k] = round1(t[k]);
  t.kcal = Math.round(t.kcal);
  t.ca = Math.round(t.ca);
  return t;
}
function allRecipes() {
  const deleted = DB.get('deleted', []);
  const over = DB.get('overrides', {});
  const own = DB.get('recipes', []);
  const seeds = SEED_RECIPES
    .filter(r => deleted.indexOf(r.id) < 0)
    .map(r => over[r.id] ? Object.assign({}, r, over[r.id]) : r);
  return seeds.concat(own).map(r => Object.assign({}, r, { macros: recipeMacros(r) }));
}
function recipesFor(mealKey) { return allRecipes().filter(r => r.meal_type === mealKey); }
function recipeById(id) { return allRecipes().find(r => r.id === id) || null; }
function isSeed(id) { return SEED_RECIPES.some(r => r.id === id); }
function saveRecipe(r) {
  const clean = Object.assign({}, r);
  delete clean.macros;
  delete clean.isNew;
  if (isSeed(clean.id)) {
    const over = DB.get('overrides', {}); over[clean.id] = clean; DB.set('overrides', over);
  } else {
    const own = DB.get('recipes', []);
    const i = own.findIndex(x => x.id === clean.id);
    if (i >= 0) own[i] = clean; else own.push(clean);
    DB.set('recipes', own);
  }
}
function deleteRecipe(id) {
  if (isSeed(id)) {
    const d = DB.get('deleted', []); if (d.indexOf(id) < 0) d.push(id); DB.set('deleted', d);
  } else {
    DB.set('recipes', DB.get('recipes', []).filter(r => r.id !== id));
  }
}
function usage() { return DB.get('usage', {}); }
function bumpUsage(id) { const u = usage(); u[id] = (u[id] || 0) + 1; DB.set('usage', u); }
function isHabitual(r) { return hasTag(r, 'habitual') || (usage()[r.id] || 0) >= 3; }
function hasTag(r, tag) { return (r.tags || []).indexOf(tag) >= 0; }

/* Uso correcto de las dos proteínas en polvo. */
function powderWarning(r) {
  const ids = (r.ingredients || []).map(i => i.ingredient_id);
  const post = hasTag(r, 'post_entreno');
  if (ids.indexOf(POWDER_POST) >= 0 && !post)
    return 'La proteína Evolate es solo post-entreno; en recetas usa la Garden of Life.';
  if (ids.indexOf(POWDER_RECIPES) >= 0 && post)
    return 'La Garden of Life es solo para recetas; post-entreno usa la Evolate.';
  return null;
}

/* ---- Registro del día ---- */
function dayLog(fecha) { return DB.get('log_' + fecha, { entries: [] }); }
function saveDayLog(fecha, log) { DB.set('log_' + fecha, log); }
function addEntry(fecha, e) { const l = dayLog(fecha); l.entries.push(e); saveDayLog(fecha, l); }
function removeEntry(fecha, id) {
  const l = dayLog(fecha);
  l.entries = l.entries.filter(e => e.id !== id);
  saveDayLog(fecha, l);
}
function dayTotals(fecha) {
  return dayLog(fecha).entries.reduce((a, e) => ({
    kcal: a.kcal + (e.kcal || 0), prot: a.prot + (e.prot || 0),
    carbs: a.carbs + (e.carbs || 0), fat: a.fat + (e.fat || 0),
    sat: a.sat + (e.sat || 0), fiber: a.fiber + (e.fiber || 0),
    fe: a.fe + (e.fe || 0), ca: a.ca + (e.ca || 0), vd: a.vd + (e.vd || 0),
  }), { kcal: 0, prot: 0, carbs: 0, fat: 0, sat: 0, fiber: 0, fe: 0, ca: 0, vd: 0 });
}
function remaining(fecha) {
  const t = targets(), d = dayTotals(fecha);
  return { kcal: t.kcal - d.kcal, prot: t.protein - d.prot, carbs: t.carbs - d.carbs, fat: t.fat - d.fat };
}
function trainedOn(fecha) { return DB.get('trained_' + fecha, false) === true; }
function setTrained(fecha, v) { DB.set('trained_' + fecha, !!v); }

/* ---- Despensa ---- */
function pantry() { return DB.get('pantry', []); }
function savePantry(item) {
  const list = pantry();
  const i = list.findIndex(p => p.ingredient_id === item.ingredient_id);
  if (i >= 0) list[i] = Object.assign(list[i], item); else list.push(item);
  DB.set('pantry', list);
}
function removePantry(id) { DB.set('pantry', pantry().filter(p => p.ingredient_id !== id)); }
function pantryQty(id) { const p = pantry().find(x => x.ingredient_id === id); return p ? (p.estimated_quantity || 0) : 0; }

/* ============================================================
   MOTOR — "¿qué me falta para cerrar el día?"
   ============================================================ */
function mealsLogged(fecha) {
  const s = {};
  dayLog(fecha).entries.forEach(e => { s[e.meal] = true; });
  return s;
}
function pendingMeals(fecha) {
  const logged = mealsLogged(fecha);
  return MEALS.map(m => m.key).filter(k => !logged[k]);
}
/* Cuánto le toca a una comida de lo que queda del día. */
function shareForMeal(fecha, mealKey) {
  const rem = remaining(fecha);
  const pending = pendingMeals(fecha);
  const pool = pending.indexOf(mealKey) >= 0 ? pending : pending.concat([mealKey]);
  const w = k => (MEALS.find(m => m.key === k) || {}).weight || 0.25;
  const total = pool.reduce((s, k) => s + w(k), 0) || 1;
  const share = w(mealKey) / total;
  return {
    kcal: rem.kcal * share, prot: rem.prot * share,
    carbs: rem.carbs * share, fat: rem.fat * share,
    share: share, isLast: pool.length === 1,
  };
}

/* Reglas de salud. */
function alerts(fecha) {
  const t = targets(), d = dayTotals(fecha), out = [];
  const closed = fecha < today();
  const lim = satLimit(t);
  if (d.sat > lim) out.push({
    level: 'warn', title: 'Grasa saturada alta',
    detail: fmt1(d.sat) + ' g de ' + lim + ' g (20 % del objetivo de grasa).',
  });
  if (d.kcal > 0 && d.kcal < RULES.kcalMin) out.push({
    level: closed ? 'crit' : 'info',
    title: closed ? 'El día cerró por debajo de 1500 kcal'
                  : 'Te faltan ' + Math.round(RULES.kcalMin - d.kcal) + ' kcal para el mínimo',
    detail: closed ? Math.round(d.kcal) + ' kcal. Aquí el riesgo es comer de menos.'
                   : 'Mínimo diario ' + RULES.kcalMin + ' kcal.',
  });
  // En un día todavía vacío estos mínimos no informan de nada: se
  // callan hasta que hay algo registrado.
  if (d.prot < RULES.proteinFloor && (d.kcal > 0 || closed)) out.push({
    level: closed ? 'crit' : 'info',
    title: closed ? 'La proteína quedó por debajo del piso'
                  : 'Faltan ' + Math.round(RULES.proteinFloor - d.prot) + ' g de proteína',
    detail: Math.round(d.prot) + ' g de ' + RULES.proteinFloor + ' g.',
  });
  return out;
}

function clampFactor(f) { return Math.max(0.6, Math.min(1.6, Math.round(f * 20) / 20)); }
/* Factor para acercar una receta al hueco: si cuadrando kcal ya se
   cubre la proteína manda las kcal; si no, manda el piso de proteína. */
function fitFactor(recipe, gap) {
  const m = recipe.macros || recipeMacros(recipe);
  const fP = (m.prot > 0 && gap.prot > 0) ? gap.prot / m.prot : null;
  const fK = (m.kcal > 0 && gap.kcal > 0) ? gap.kcal / m.kcal : null;
  if (fP == null && fK == null) return 1;
  if (fP == null) return clampFactor(fK);
  if (fK == null) return clampFactor(fP);
  return clampFactor(fK >= fP ? fK : Math.min(fP, fK * 1.15));
}
function scaleRecipe(recipe, factor) {
  if (!factor || factor === 1) return recipe;
  const s = Object.assign({}, recipe, {
    ingredients: (recipe.ingredients || []).map(i => ({
      ingredient_id: i.ingredient_id,
      amount_g: Math.max(1, Math.round((i.amount_g * factor) / 5) * 5),
    })),
  });
  s.macros = recipeMacros(s);
  return s;
}
function recipeDensity(r) {
  const m = r.macros || recipeMacros(r);
  return m.kcal ? m.prot / m.kcal : 0;
}
function hasGoodFats(r) {
  return (r.ingredients || []).some(i => {
    const f = foodById(i.ingredient_id);
    return foodHasTag(f, 'pescado_azul') || foodHasTag(f, 'grasa_insaturada');
  });
}
/* La Evolate solo los días de entreno. */
function postWorkoutOk(r, fecha) { return !hasTag(r, 'post_entreno') || trainedOn(fecha); }

function scoreRecipe(recipe, gap, ctx) {
  ctx = ctx || {};
  const m = recipe.macros || recipeMacros(recipe);
  const why = [], careful = [];

  // Proteína: es un piso. Quedarse corto penaliza mucho; pasarse, poco.
  let sP;
  if (gap.prot <= 0) {
    sP = m.prot <= 5 ? 100 : Math.max(0, 100 - (m.prot - 5) * 1.5);
  } else {
    const r = m.prot / gap.prot;
    sP = r >= 1 ? Math.max(60, 100 - (r - 1) * 25) : Math.max(0, 100 - (1 - r) * 110);
    if (r >= 0.85 && r <= 1.25) why.push('cuadra la proteína que falta');
  }

  // kcal: desviarse en cualquier dirección resta; pasarse, algo más.
  let sK;
  if (gap.kcal <= 0) {
    sK = m.kcal <= 120 ? 80 : Math.max(0, 80 - (m.kcal - 120) / 6);
    if (m.kcal > 120) careful.push('ya has llegado a las kcal del día');
  } else {
    const diff = m.kcal - gap.kcal;
    const rel = Math.abs(diff) / Math.max(gap.kcal, 120);
    sK = Math.max(0, 100 - rel * (diff > 0 ? 95 : 70));
    if (rel <= 0.12) why.push('encaja en las kcal restantes');
  }

  // Saturadas: se reparte el margen del día entre las comidas que
  // faltan, con holgura para que un huevo no dispare el aviso.
  const satLeft = Math.max(0, satLimit() - (ctx.satSoFar || 0));
  const satShare = satLeft * (ctx.satShare == null ? 1 : ctx.satShare);
  const satBudget = Math.min(satLeft, satShare * RULES.satShareTolerance);
  let sS = 100;
  if (m.sat > satBudget) {
    sS = Math.max(0, 100 - ((m.sat - satBudget) / Math.max(satBudget, 3)) * 60);
    careful.push('aporta ' + fmt1(m.sat) + ' g de saturadas (quedan ' + fmt1(satLeft) + ' g hoy)');
  }

  let sF = 100;
  if (gap.fat > 0 && m.fat > gap.fat * 1.35) sF = Math.max(30, 100 - ((m.fat - gap.fat) / gap.fat) * 55);
  let sC = 100;
  if (gap.carbs > 0) sC = Math.max(35, 100 - (Math.abs(m.carbs - gap.carbs) / Math.max(gap.carbs, 25)) * 45);

  let score = sP * 0.34 + sK * 0.28 + sS * 0.14 + sF * 0.12 + sC * 0.12;

  // Densidad proteica: orden, no filtro.
  const dens = recipeDensity(recipe);
  if (dens >= 0.09) { score += 6; why.push('mucha proteína por caloría'); }
  else if (dens >= 0.06) { score += 3; }
  else if (dens < 0.03 && m.kcal > 250) { score -= 5; careful.push('muchas kcal para poca proteína'); }

  // Grasas insaturadas y pescado azul cuando hay margen de grasa.
  const fatMargin = ctx.fatLeft == null ? gap.fat : ctx.fatLeft;
  if (fatMargin >= RULES.fatMarginForGoodFats && (hasTag(recipe, 'pescado_azul') || hasGoodFats(recipe))) {
    score += 7; why.push('grasas insaturadas y hoy hay margen de grasa');
  }
  if (isHabitual(recipe)) { score += 4; why.push('la haces a menudo'); }
  if (ctx.recent) {
    const reps = ctx.recent.filter(id => id === recipe.id).length;
    if (reps) score -= 14 + (reps - 1) * 12;
  }
  return { raw: score, why: why, careful: careful };
}

function recentRecipeIds(fecha, days) {
  const ids = [];
  for (let i = 1; i <= (days || 3); i++) {
    const d = shiftDate(fecha, -i);
    dayLog(d).entries.forEach(e => { if (e.recipe_id) ids.push(e.recipe_id); });
  }
  return ids;
}

/* LA función: qué comer en esta comida para cerrar el día. */
function suggestFor(mealKey, fecha, limit) {
  const gap = shareForMeal(fecha, mealKey);
  const tot = dayTotals(fecha), rem = remaining(fecha);
  const ctx = { satSoFar: tot.sat, fatLeft: rem.fat, satShare: gap.share, recent: recentRecipeIds(fecha, 3) };

  const scored = recipesFor(mealKey)
    .filter(r => postWorkoutOk(r, fecha))
    .map(r => {
      // Se ajusta la porción al hueco y se puntúa lo que de verdad se comerá.
      const factor = fitFactor(r, gap);
      const adj = scaleRecipe(r, factor);
      const s = scoreRecipe(adj, gap, ctx);
      return { recipe: r, adjusted: adj, factor: factor, macros: adj.macros, raw: s.raw, why: s.why, careful: s.careful };
    })
    .sort((a, b) => b.raw - a.raw);

  // Encaje relativo al mejor: con los bonus, varios saturarían en 100.
  const best = scored.length ? Math.max(scored[0].raw, 1) : 1;
  scored.forEach(s => { s.fit = Math.max(1, Math.round((s.raw / best) * 100)); });
  return { gap: gap, remaining: rem, list: scored.slice(0, limit || 3) };
}

/* Cerrar el hueco de proteína con un solo ingrediente. */
function suggestIngredients(fecha, limit) {
  const rem = remaining(fecha);
  if (rem.prot <= 3 || rem.kcal <= 0) return [];
  const satLeft = Math.max(0, satLimit() - dayTotals(fecha).sat);
  const trained = trainedOn(fecha);
  return allFoods()
    .filter(f => f.kcal100 > 0 && f.prot100 >= 10)
    .filter(f => !foodHasTag(f, 'post_entreno') || trained)
    .filter(f => !foodHasTag(f, 'solo_recetas'))
    .map(f => {
      const grams = Math.min(400, Math.max(15, Math.round(((rem.prot / f.prot100) * 100) / 5) * 5));
      return { food: f, grams: grams, macros: macrosOf(f, grams), dens: density(f) };
    })
    .filter(x => x.macros.kcal <= rem.kcal * 1.1 && x.macros.sat <= satLeft + 0.5)
    .sort((a, b) => b.dens - a.dens)
    .slice(0, limit || 3);
}

/* ============================================================
   FAVORITOS Y COMPOSITOR DE RECETAS
   Dados unos ingredientes y unos macros objetivo, calcula los
   gramos de cada uno. Es un problema de ajuste, no de búsqueda:
   se parte de una ración razonable y se afina ingrediente a
   ingrediente hasta que deja de mejorar.
   ============================================================ */

const FAV_SEED = {
  desayuno: ['b003', 'b230', 'b074', 'b231', 'b070', 'b220', 'b023', 'b024', 'b101'],
  almuerzo: [], snack: [], cena: [],
};

function favorites(meal) {
  const saved = DB.get('favs', null);
  if (saved && saved[meal]) return saved[meal];
  return (FAV_SEED[meal] || []).slice();
}
function setFavorites(meal, ids) {
  const all = DB.get('favs', null) || JSON.parse(JSON.stringify(FAV_SEED));
  all[meal] = ids;
  DB.set('favs', all);
}
function toggleFavorite(meal, id) {
  const list = favorites(meal).slice();
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1); else list.push(id);
  setFavorites(meal, list);
  return list;
}
function isFavorite(meal, id) { return favorites(meal).indexOf(id) >= 0; }

/* Tope razonable por ingrediente, para que no proponga 300 g de
   aguacate ni medio bote de proteína con tal de cuadrar el número. */
function composeCap(f) {
  if (f.kcal100 >= 500) return 40;                               // aceites, cremas, frutos secos
  if (f.prot100 >= 60) return 60;                                // proteína en polvo
  if (f.fat100 >= 10) return 100;                                // aguacate, huevo, quesos
  if (f.kcal100 >= 300) return 120;                              // granola, avena, secos
  if (f.cat === 'Carbohidratos' && f.kcal100 >= 200) return 150; // panes
  if (f.cat === 'Frutas') return 200;                            // una pieza y media, no tres
  if (f.peso_ud_g) return Math.max(f.peso_ud_g * 2, 120);
  return 300;
}

/* Cantidad mínima con sentido en una receta. Por debajo de esto no se
   usa el ingrediente: 5 g de granola no son un ingrediente, son ruido. */
function composeMin(f) {
  if (f.peso_ud_g) return f.peso_ud_g;
  if (f.kcal100 >= 500) return 5;
  if (f.prot100 >= 60) return 10;
  return 20;
}

/* Cantidades que se van a probar. Lo que se compra por unidades
   (huevos, rebanadas) salta de unidad en unidad; el resto de 5 en 5. */
function composeGrid(f, obligatorio) {
  const cap = composeCap(f), min = composeMin(f);
  // Con `obligatorio` no se ofrece el 0: el ingrediente entra sí o sí.
  const out = obligatorio ? [] : [0];
  if (f.peso_ud_g) {
    for (let g = f.peso_ud_g; g <= cap; g += f.peso_ud_g) out.push(g);
  } else {
    for (let g = min; g <= cap; g += 5) out.push(g);
  }
  if (!out.length) out.push(min);
  return out;
}

function sumFor(foods, amounts) {
  const t = { kcal: 0, prot: 0, carbs: 0, fat: 0, sat: 0, fiber: 0, fe: 0, ca: 0, vd: 0 };
  foods.forEach((f, i) => {
    if (!amounts[i]) return;
    const m = macrosOf(f, amounts[i]);
    for (const k in t) t[k] += m[k];
  });
  return t;
}

/* Error contra los objetivos. Solo cuentan los que se hayan puesto:
   pedir proteína y fibra no debería forzar un número de grasa. */
const COMPOSE_WEIGHTS = { prot: 3, carbs: 2, fiber: 2, kcal: 1.5, fat: 1 };
/* Cada ingrediente extra paga un peaje pequeño: cuadrar el número con
   nueve alimentos es peor receta que cuadrarlo casi igual con cuatro. */
const COMPOSE_ITEM_COST = 0.05;
function composeError(totals, targets, usados) {
  let e = usados ? usados * COMPOSE_ITEM_COST : 0;
  for (const k in targets) {
    const t = targets[k];
    if (t == null || isNaN(t)) continue;
    const diff = (totals[k] || 0) - t;
    const scale = Math.max(t, 10);
    // Pasarse penaliza algo más que quedarse corto en kcal y grasa
    const over = diff > 0 && (k === 'kcal' || k === 'fat') ? 1.3 : 1;
    e += (COMPOSE_WEIGHTS[k] || 1) * over * Math.pow(diff / scale, 2);
  }
  return e;
}

/**
 * Ajusta los gramos de cada ingrediente para acercarse a los objetivos.
 * Descenso por coordenadas: recorre un ingrediente cada vez probando
 * cantidades en pasos de 5 g y se queda con la que menos error deja.
 * Permite el 0, así que puede descartar lo que no haga falta.
 */
function composeRecipe(ids, targets, opts) {
  opts = opts || {};
  const todos = opts.todos !== false;   // por defecto, se usan TODOS los elegidos
  const foods = ids.map(foodById).filter(Boolean);
  if (!foods.length) return null;
  const grids = foods.map(f => composeGrid(f, todos));

  let amounts = foods.map((f, i) => {
    // `seed` marca desde dónde arranca cada ingrediente. Partir de sitios
    // distintos es lo que hace que salgan repartos distintos: si siempre
    // se empieza igual, siempre se cae en la misma solución.
    if (!todos && opts.seed && opts.seed.indexOf(i) < 0) return 0;
    if (opts.aleatorio) return grids[i][Math.floor(Math.random() * grids[i].length)];
    const d = Math.min(composeCap(f), defaultGrams(f));
    return grids[i].reduce((best, g) => Math.abs(g - d) < Math.abs(best - d) ? g : best, grids[i][0]);
  });
  const errOf = a => composeError(sumFor(foods, a), targets, a.filter(x => x > 0).length);

  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 0; i < foods.length; i++) {
      const start = amounts[i];
      let bestG = start, bestE = errOf(amounts);
      for (const g of grids[i]) {
        if (g === start) continue;
        amounts[i] = g;
        const e = errOf(amounts);
        if (e < bestE - 1e-9) { bestE = e; bestG = g; }
      }
      amounts[i] = bestG;
      if (bestG !== start) moved = true;
    }
    if (!moved) break;
  }

  const items = foods
    .map((f, i) => ({
      food: f, grams: amounts[i],
      uds: f.peso_ud_g ? Math.round(amounts[i] / f.peso_ud_g) : null,
    }))
    .filter(x => x.grams > 0);
  const totals = sumFor(foods, amounts);

  return {
    items: items,
    totals: totals,
    dropped: foods.filter((f, i) => !amounts[i]).map(f => shortName(f)),
    gaps: composeGaps(totals, targets),
    error: composeError(totals, targets, items.length),
    key: items.map(x => x.food.id).sort().join('|'),
    usaTodos: items.length === foods.length,
  };
}

/**
 * Propuestas para unos ingredientes y unos objetivos.
 *
 * La primera usa SIEMPRE todos los ingredientes elegidos: si los has
 * seleccionado es porque quieres comerlos, no para darme permiso.
 * Las siguientes son versiones más cortas, y cada una dice en voz alta
 * qué ha quitado, para que nunca desaparezca nada en silencio.
 */
function composeOptions(ids, targets, howMany) {
  const n = ids.length;
  if (!n) return [];

  // Con todos: varios arranques y nos quedamos con el mejor reparto
  let conTodos = composeRecipe(ids, targets, { todos: true });
  for (let i = 0; i < 8; i++) {
    const r = composeRecipe(ids, targets, { todos: true, aleatorio: true });
    if (r && r.error < conTodos.error) conTodos = r;
  }
  if (conTodos) conTodos.etiqueta = 'Con todos tus ingredientes';
  const out = conTodos ? [conTodos] : [];
  if (n <= 2) return out;

  // Versiones más cortas, solo si de verdad cuadran mejor
  const cortas = {};
  for (let intento = 0; intento < 16; intento++) {
    const idx = [];
    for (let i = 0; i < n; i++) idx.push(i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    const cuantos = Math.min(n, 3 + Math.floor(Math.random() * 3));
    const r = composeRecipe(ids, targets, { todos: false, seed: idx.slice(0, cuantos) });
    if (!r || !r.items.length || r.usaTodos) continue;
    if (cortas[r.key] && cortas[r.key].error <= r.error) continue;
    cortas[r.key] = r;
  }
  const lista = Object.keys(cortas).map(k => cortas[k]).sort((a, b) => a.error - b.error);
  lista.forEach(r => {
    r.etiqueta = 'Versión más corta';
    r.quita = r.dropped;
  });
  return out.concat(lista.slice(0, (howMany || 3) - out.length));
}

/* Qué objetivos quedaron lejos, para poder decirlo con claridad. */
function composeGaps(totals, targets) {
  const out = [];
  const labels = { prot: 'proteína', carbs: 'carbohidratos', fat: 'grasa', fiber: 'fibra', kcal: 'kcal' };
  for (const k in targets) {
    const t = targets[k];
    if (t == null || isNaN(t)) continue;
    const v = totals[k] || 0;
    const diff = v - t;
    if (Math.abs(diff) / Math.max(t, 1) > 0.12) {
      out.push({ key: k, label: labels[k] || k, target: t, value: v, diff: diff });
    }
  }
  return out;
}

/**
 * Si algún objetivo se queda corto, busca qué ingrediente lo cerraría
 * mejor sin cargar de kcal. Mira primero entre los favoritos de esa
 * comida, que es lo que la usuaria tiene y usa.
 */
function suggestIngredientFor(gap, meal, alreadyIds) {
  if (!gap || gap.diff >= 0) return null;
  const key = gap.key === 'kcal' ? 'kcal' : gap.key;
  const per100 = { prot: 'prot100', carbs: 'carbs100', fat: 'fat100', fiber: 'fiber100', kcal: 'kcal100' }[key];
  if (!per100) return null;
  const falta = -gap.diff;
  const favIds = favorites(meal);

  const candidatos = allFoods()
    .filter(f => alreadyIds.indexOf(f.id) < 0)
    .filter(f => (f[per100] || 0) > 0)
    .map(f => {
      const grams = Math.min(composeCap(f), Math.max(5, Math.round((falta / f[per100]) * 100 / 5) * 5));
      const aporta = (f[per100] * grams) / 100;
      const kcal = (f.kcal100 * grams) / 100;
      // Cuanto más aporte de lo que falta por caloría, mejor
      const eficiencia = kcal > 0 ? aporta / kcal : aporta;
      return { food: f, grams: grams, aporta: aporta, kcal: kcal, score: eficiencia * (favIds.indexOf(f.id) >= 0 ? 1.6 : 1) };
    })
    .filter(x => x.aporta >= falta * 0.5)
    .sort((a, b) => b.score - a.score);

  return candidatos.length ? candidatos[0] : null;
}

/* Cuáles de los ingredientes de la receta no están en casa. */
function missingFromPantry(items) {
  return items
    .filter(x => pantryQty(x.food.id) < x.grams)
    .map(x => ({
      nombre: x.food.nombre,
      falta: Math.round(x.grams - pantryQty(x.food.id)),
      unit: x.food.unit || 'g',
      tiene: Math.round(pantryQty(x.food.id)),
    }));
}

/* ============================================================
   PAPELES Y FORMATOS DE RECETA
   Una receta no es una suma de macros: es un formato (tortitas,
   bowl, muffins) donde cada ingrediente cumple un papel. Sin esto
   el cálculo puede meter berenjena en un desayuno porque encaja
   en los números.
   ============================================================ */

function foodRoles(f) {
  if (!f) return [];
  if (f._roles) return f._roles;
  // Un plato ya hecho se registra, pero no es un ingrediente: nadie compone
  // unas tortitas «con huevos rotos con jamón». Sin papeles, el compositor
  // ni lo mira.
  if (f.cat === 'Platos') return [];
  const n = norm(f.nombre), cat = f.cat || '', r = [];
  const add = x => { if (r.indexOf(x) < 0) r.push(x); };

  if (/leche|bebida de|batido de/.test(n) && !/coco \(lata\)/.test(n)) add('liquido');
  if (/yogur|iogurt|skyr|kefir|quark|queso batido|requeson|queso fresco|cottage/.test(n)) { add('yogur_base'); add('lacteo_prot'); }
  if (/copos de avena|avena instant|harina/.test(n)) add('cereal_seco');
  if (/granola|muesli|copos de maiz|tortitas de arroz/.test(n)) add('crujiente');
  if (cat === 'Frutas') add('fruta');
  if (f.prot100 >= 60 && /protein|whey|proteina|clara de huevo en polvo/.test(n)) add('prot_polvo');
  if (/huevo/.test(n) && !/en polvo/.test(n)) add('huevo');
  if (/^pan|pan de|tostada|baguette|wrap|tortillas de trigo|pan crujiente/.test(n)) add('pan');
  if (/aguacate|crema de|mantequilla de|tahini|hummus/.test(n)) add('grasa_untar');
  if (cat === 'Proteínas' && !/huevo/.test(n)) add('prot_animal');
  if (cat === 'Verduras' && !/aguacate|maiz/.test(n)) add('verdura');
  if (cat === 'Carbohidratos' && /arroz|pasta|patata|boniato|quinoa|macarron|espagueti|maiz|cuscus|bulgur|mijo|sarraceno|espelta|fideo|noodle|noqui/.test(n)) add('carbo_guarnicion');
  if (/salvado|cereales integrales/.test(n)) add('cereal_seco');
  if (/biscote|picos de pan|pa de pages|regana/.test(n)) add('pan');
  if (cat === 'Verduras' && /maiz/.test(n)) add('verdura');
  if (cat === 'Legumbres') add('legumbre');
  if (/miel|mermelada|datil|sirope/.test(n)) add('endulzante');
  if (/aceite/.test(n)) add('aceite');
  if (/chia|lino|almendra|nuece|pistacho|avellana|anacardo|cacahuete|sesamo|^semillas de|pipas|pinones|macadamia|pecana/.test(n)) add('semillas');
  // Los quesos curados son otra cosa que el yogur: van en ensaladas y tostadas.
  // El parmesano y la mozzarella están catalogados en Otros, así que no se
  // puede exigir la categoría.
  if (/queso|mozzarella|parmesano/.test(n) && !/batido|cottage|requeson/.test(n)) add('queso');
  if (/burgos|queso fresco/.test(n)) add('yogur_base');
  if (/mantequilla$|margarina|ghee/.test(n)) add('grasa_untar');
  if (/cacao|chocolate/.test(n)) add('cacao');

  try { Object.defineProperty(f, '_roles', { value: r, enumerable: false }); } catch (e) {}
  return r;
}
function hasRole(f, role) { return foodRoles(f).indexOf(role) >= 0; }

function templatesFor(meal, maxTiempo) {
  return TEMPLATES.filter(t => t.meals.indexOf(meal) >= 0)
    .filter(t => !maxTiempo || t.tiempo <= maxTiempo);
}

/* ============================================================
   PROPUESTA DE RECETAS
   Se elige un formato, se reparten los ingredientes elegidos por
   sus papeles y se ajustan los gramos dentro de lo que cada papel
   admite. Así lo que sale es una receta, no una suma que cuadra.
   ============================================================ */

/**
 * Coloca TODOS los ingredientes elegidos en los papeles del formato.
 * Un papel puede llevar dos cosas (dos frutas en un bowl, huevo y clara
 * en un revuelto), porque elegir un ingrediente significa quererlo en el
 * plato, no darle permiso al cálculo para descartarlo.
 */
/* Qué poner en un papel obligatorio que no cubre la selección. Se mira
   primero entre los favoritos de esa comida y lo que hay en casa: es más
   probable que lo tenga a mano. */
function fillerFor(role, meal, excluirIds) {
  const favs = favorites(meal);
  const cand = allFoods()
    .filter(f => excluirIds.indexOf(f.id) < 0)
    .filter(f => hasRole(f, role.key))
    .filter(f => !role.filtro || role.filtro.test(norm(f.nombre)));
  if (!cand.length) return null;
  cand.sort((a, b) =>
    (favs.indexOf(b.id) >= 0 ? 2 : 0) - (favs.indexOf(a.id) >= 0 ? 2 : 0) ||
    (pantryQty(b.id) > 0 ? 1 : 0) - (pantryQty(a.id) > 0 ? 1 : 0) ||
    density(b) - density(a));
  return cand[0];
}

function assignAll(tpl, selectedIds, meal, conRelleno) {
  const foods = selectedIds.map(foodById).filter(Boolean);
  const ocupado = {};
  const asig = [], sobran = [];

  foods.forEach(f => {
    const posibles = tpl.roles.filter(r =>
      hasRole(f, r.key) &&
      (!r.filtro || r.filtro.test(norm(f.nombre))) &&
      (ocupado[r.key] || 0) < 2);
    if (!posibles.length) { sobran.push(f); return; }
    // Primero los papeles aún vacíos, y entre ellos el más específico
    posibles.sort((a, b) =>
      (ocupado[a.key] || 0) - (ocupado[b.key] || 0) ||
      (b.req ? 1 : 0) - (a.req ? 1 : 0));
    const r = posibles[0];
    ocupado[r.key] = (ocupado[r.key] || 0) + 1;
    asig.push({ role: r, food: f, segundo: ocupado[r.key] > 1 });
  });

  let faltanReq = tpl.roles.filter(r => r.req && !ocupado[r.key]);
  const anadidos = [];

  // Un formato no se descarta por faltarle una pieza: se propone diciendo
  // qué hay que añadir, que es más útil que no ofrecer la receta.
  if (conRelleno && faltanReq.length) {
    const yaUsados = selectedIds.slice();
    faltanReq.forEach(r => {
      const f = fillerFor(r, meal, yaUsados);
      if (!f) return;
      yaUsados.push(f.id);
      asig.push({ role: r, food: f, segundo: false, anadido: true });
      anadidos.push(f);
      ocupado[r.key] = 1;
    });
    faltanReq = tpl.roles.filter(r => r.req && !ocupado[r.key]);
  }
  return { asig: asig, sobran: sobran, faltanReq: faltanReq, anadidos: anadidos };
}

/* Ajusta los gramos de una asignación. `fijos` son los gramos que la
   usuaria ha decidido a mano: esos no se tocan. */
function fitAssignment(asig, targets, fijos) {
  if (!asig.length) return null;
  const grids = asig.map(x => {
    const fijo = fijos && fijos[x.food.id];
    if (fijo) return [fijo];
    // Al segundo ingrediente de un mismo papel no se le exige la ración
    // entera: dos frutas en un bowl se reparten el sitio.
    const min = x.segundo ? composeMin(x.food) : Math.max(x.role.min, composeMin(x.food));
    const max = Math.max(min, x.role.max);
    const paso = x.food.peso_ud_g && x.food.peso_ud_g <= max ? x.food.peso_ud_g : 5;
    const out = [];
    for (let g = paso === 5 ? min : Math.max(paso, Math.ceil(min / paso) * paso); g <= max; g += paso) out.push(g);
    if (!out.length) out.push(min);
    return out;
  });
  const foods = asig.map(x => x.food);
  let amounts = grids.map(g => g[Math.floor(g.length / 2)]);
  const errOf = a => composeError(sumFor(foods, a), targets, 0);

  for (let pass = 0; pass < 25; pass++) {
    let moved = false;
    for (let i = 0; i < asig.length; i++) {
      const start = amounts[i];
      let bestG = start, bestE = errOf(amounts);
      for (const g of grids[i]) {
        if (g === start) continue;
        amounts[i] = g;
        const e = errOf(amounts);
        if (e < bestE - 1e-9) { bestE = e; bestG = g; }
      }
      amounts[i] = bestG;
      if (bestG !== start) moved = true;
    }
    if (!moved) break;
  }
  const items = asig.map((x, i) => ({
    food: x.food, grams: amounts[i], role: x.role.label,
    uds: x.food.peso_ud_g ? Math.round(amounts[i] / x.food.peso_ud_g) : null,
    fijo: !!(fijos && fijos[x.food.id]),
    anadido: !!x.anadido,
  }));
  const totals = sumFor(foods, amounts);
  return { items: items, totals: totals, error: composeError(totals, targets, 0) };
}

function recipeTitle(tpl, items) {
  const claves = items
    .filter(x => x.role !== 'aceite' && x.role !== 'toque dulce')
    .sort((a, b) => b.grams * (b.food.kcal100 || 1) - a.grams * (a.food.kcal100 || 1))
    .slice(0, 2)
    .map(x => shortName(x.food).toLowerCase());
  if (!claves.length) return tpl.nombre;
  const nexo = /\sde\s/.test(tpl.nombre) ? ' con ' : ' de ';
  return tpl.nombre + nexo + (claves.length > 1 ? claves[0] + ' y ' + claves[1] : claves[0]);
}

/**
 * Recetas propuestas. Se prefieren las que colocan todo lo elegido; solo
 * se admite dejar algo fuera cuando el formato no tiene dónde ponerlo, y
 * entonces se dice. Siempre se intenta devolver al menos tres platos.
 */
function proposeRecipes(meal, selectedIds, targets, opts) {
  opts = opts || {};
  const minimo = opts.cuantas || 3;

  const evaluar = (tpl, fueraDeTiempo, conRelleno) => {
    const a = assignAll(tpl, selectedIds, meal, conRelleno);
    if (a.faltanReq.length) return null;              // ni con relleno se sostiene
    if (a.asig.length < (tpl.min_ing || 2)) return null;
    const r = fitAssignment(a.asig, targets, opts.fijos);
    if (!r) return null;
    r.tpl = tpl;
    r.nombre = recipeTitle(tpl, r.items);
    r.tiempo = tpl.tiempo;
    r.pasos = tpl.pasos;
    r.gaps = composeGaps(r.totals, targets);
    r.sinUsar = a.sobran.map(f => shortName(f));
    r.anadidos = (a.anadidos || []).map(f => shortName(f));
    r.fueraDeTiempo = !!fueraDeTiempo;
    return r;
  };

  // Orden: usar todo lo elegido manda; después, necesitar menos añadidos;
  // después, cuadrar mejor con los macros.
  const ordenar = list => list.sort((a, b) =>
    a.sinUsar.length - b.sinUsar.length ||
    a.anadidos.length - b.anadidos.length ||
    a.error - b.error);

  const recoger = (tpls, fuera, relleno) => {
    const vistos = {};
    return ordenar(tpls.map(t => evaluar(t, fuera, relleno)).filter(Boolean)
      .filter(r => vistos[r.tpl.id] ? false : (vistos[r.tpl.id] = true)));
  };

  const enTiempo = templatesFor(meal, opts.maxTiempo);
  let out = recoger(enTiempo, false, false);

  // Si no llegan tres, se admiten formatos que necesitan un ingrediente
  // más, y solo después se relaja el tiempo. Cada receta lo dice.
  if (out.length < minimo) {
    const ya = out.map(r => r.tpl.id);
    out = out.concat(recoger(enTiempo.filter(t => ya.indexOf(t.id) < 0), false, true));
  }
  if (out.length < minimo && opts.maxTiempo) {
    const ya = out.map(r => r.tpl.id);
    const fuera = templatesFor(meal, 0).filter(t => ya.indexOf(t.id) < 0);
    out = out.concat(recoger(fuera, true, false)).concat(
      recoger(fuera.filter(t => out.every(r => r.tpl.id !== t.id)), true, true));
  }
  return out.slice(0, Math.max(minimo, 3));
}

/**
 * Qué le falta para poder hacer más recetas. Solo mira papeles que de
 * verdad usan los formatos de esa comida, así que nunca propondrá una
 * berenjena para desayunar.
 */
function missingRoleSuggestions(meal, selectedIds, opts) {
  opts = opts || {};
  const tpls = templatesFor(meal, opts.maxTiempo);
  const foods = selectedIds.map(foodById).filter(Boolean);
  const tiene = role => foods.some(f => hasRole(f, role));
  const faltan = {};

  tpls.forEach(tpl => {
    const req = tpl.roles.filter(r => r.req);
    const sinCubrir = req.filter(r => !tiene(r.key));
    // Solo interesa si con un ingrediente más se desbloquea el formato
    if (sinCubrir.length === 1) {
      const k = sinCubrir[0].key;
      (faltan[k] = faltan[k] || { role: sinCubrir[0], formatos: [] }).formatos.push(tpl.nombre);
    }
  });

  return Object.keys(faltan).map(k => {
    const info = faltan[k];
    const favs = favorites(meal);
    const cand = allFoods()
      .filter(f => hasRole(f, k) && selectedIds.indexOf(f.id) < 0)
      .sort((a, b) => (favs.indexOf(b.id) >= 0 ? 1 : 0) - (favs.indexOf(a.id) >= 0 ? 1 : 0)
                    || density(b) - density(a));
    return cand.length ? { role: info.role, formatos: info.formatos, food: cand[0] } : null;
  }).filter(Boolean);
}

/* ============================================================
   MENÚ SEMANAL Y COMPRA
   ============================================================ */
function weekStartOf(fecha) {
  const p = fecha.split('-').map(Number);
  const ms = Date.UTC(p[0], p[1] - 1, p[2]);
  const dow = new Date(ms).getUTCDay();
  return isoFromMs(ms + (dow === 0 ? -6 : 1 - dow) * 86400000);
}
function weekDates(ws) {
  const p = ws.split('-').map(Number);
  const base = Date.UTC(p[0], p[1] - 1, p[2]);
  const out = [];
  for (let i = 0; i < 7; i++) out.push(isoFromMs(base + i * 86400000));
  return out;
}
function daysApart(a, b) {
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.abs(Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000;
}
function getMenu(ws) { return DB.get('menu_' + ws, null); }
function setMenu(m) { DB.set('menu_' + m.week_start, m); }

function slotRecipe(slot) {
  if (!slot || !slot.recipe_id) return null;
  const r = recipeById(slot.recipe_id);
  if (!r) return null;
  return (slot.factor && slot.factor !== 1) ? scaleRecipe(r, slot.factor) : r;
}
function menuDayTotals(day) {
  const t = { kcal: 0, prot: 0, carbs: 0, fat: 0, sat: 0, fiber: 0, fe: 0, ca: 0, vd: 0 };
  (day.meal_slots || []).forEach(s => {
    const r = slotRecipe(s);
    if (!r) return;
    for (const k in t) t[k] += r.macros[k] || 0;
  });
  return t;
}
/* Hueco que le queda a una comida dentro de su día. */
function slotGap(day, mealKey) {
  const t = targets();
  const other = { kcal: 0, prot: 0, carbs: 0, fat: 0 };
  (day.meal_slots || []).forEach(s => {
    if (s.meal_type === mealKey) return;
    const r = slotRecipe(s);
    if (!r) return;
    other.kcal += r.macros.kcal; other.prot += r.macros.prot;
    other.carbs += r.macros.carbs; other.fat += r.macros.fat;
  });
  return {
    kcal: Math.max(0, t.kcal - other.kcal), prot: Math.max(0, t.protein - other.prot),
    carbs: Math.max(0, t.carbs - other.carbs), fat: Math.max(0, t.fat - other.fat),
  };
}

/* Genera 7 días cuadrando cada uno con los objetivos. Escala las
   porciones: sin eso el menú se queda muy por debajo de las kcal. */
function generateMenu(ws) {
  const prev = getMenu(ws);
  const t = targets();
  const history = [];
  const days = weekDates(ws).map(date => {
    const prevDay = prev && prev.days.find(d => d.date === date);
    const slots = [];
    let left = { kcal: t.kcal, prot: t.protein, carbs: t.carbs, fat: t.fat };
    let satSoFar = 0;

    MEALS.forEach((meal, idx) => {
      const prevSlot = prevDay && prevDay.meal_slots.find(s => s.meal_type === meal.key);
      if (prevSlot && prevSlot.is_locked && prevSlot.recipe_id) {
        const locked = recipeById(prevSlot.recipe_id);
        if (locked) {
          const f = prevSlot.factor || 1;
          const m = scaleRecipe(locked, f).macros;
          left = { kcal: left.kcal - m.kcal, prot: left.prot - m.prot, carbs: left.carbs - m.carbs, fat: left.fat - m.fat };
          satSoFar += m.sat || 0;
          slots.push({ meal_type: meal.key, recipe_id: locked.id, factor: f, is_locked: true });
          history.push({ date: date, id: locked.id });
          return;
        }
      }
      const restWeight = MEALS.slice(idx).reduce((s, m) => s + m.weight, 0);
      const share = meal.weight / restWeight;
      const gap = { kcal: left.kcal * share, prot: left.prot * share, carbs: left.carbs * share, fat: left.fat * share };

      // Repeticiones cercanas y de toda la semana, para que no salga
      // siempre el mismo desayuno.
      const recent = history.filter(h => daysApart(h.date, date) <= 2).map(h => h.id)
        .concat(history.map(h => h.id));

      const pool = recipesFor(meal.key).filter(r => postWorkoutOk(r, date));
      if (!pool.length) { slots.push({ meal_type: meal.key, recipe_id: null, factor: 1, is_locked: false }); return; }

      const ranked = pool.map(r => {
        const factor = fitFactor(r, gap);
        const adj = scaleRecipe(r, factor);
        const s = scoreRecipe(adj, gap, { satSoFar: satSoFar, fatLeft: left.fat, satShare: share, recent: recent });
        return { r: r, factor: factor, adj: adj, raw: s.raw };
      }).sort((a, b) => b.raw - a.raw);

      const best = ranked[0];
      const m = best.adj.macros;
      left = { kcal: left.kcal - m.kcal, prot: left.prot - m.prot, carbs: left.carbs - m.carbs, fat: left.fat - m.fat };
      satSoFar += m.sat || 0;
      slots.push({ meal_type: meal.key, recipe_id: best.r.id, factor: best.factor, is_locked: false });
      history.push({ date: date, id: best.r.id });
    });
    return { date: date, meal_slots: slots };
  });
  const menu = { week_start: ws, days: days, generated_at: new Date().toISOString() };
  setMenu(menu);
  return menu;
}

/* Lista de la compra: suma el menú y resta lo que ya hay en casa. */
function shoppingList(menu) {
  if (!menu) return null;
  const need = {};
  menu.days.forEach(d => (d.meal_slots || []).forEach(s => {
    const r = slotRecipe(s);
    if (!r) return;
    (r.ingredients || []).forEach(i => { need[i.ingredient_id] = (need[i.ingredient_id] || 0) + i.amount_g; });
  }));
  const lines = [];
  Object.keys(need).forEach(id => {
    const f = foodById(id);
    if (!f) return;
    const have = pantryQty(id);
    lines.push({
      id: id, nombre: f.nombre, cat: f.cat || 'Otros', unit: f.unit || 'g',
      need: Math.round(need[id]), have: Math.round(have),
      buy: Math.round(Math.max(0, need[id] - have)),
    });
  });
  const pend = lines.filter(l => l.buy > 0);
  const byCat = {};
  pend.forEach(l => { (byCat[l.cat] = byCat[l.cat] || []).push(l); });
  const groups = Object.keys(byCat).sort().map(c => ({
    cat: c, items: byCat[c].sort((a, b) => a.nombre.localeCompare(b.nombre)),
  }));
  return { groups: groups, count: pend.length, covered: lines.length - pend.length };
}

/* Recetas que puedes hacer con lo que hay en casa. */
function cookableNow(minCoverage) {
  const have = {};
  pantry().forEach(p => { have[p.ingredient_id] = true; });
  if (!Object.keys(have).length) return [];
  const min = minCoverage == null ? 0.5 : minCoverage;
  return allRecipes().map(r => {
    const ings = r.ingredients || [];
    if (!ings.length) return null;
    const got = ings.filter(i => have[i.ingredient_id]);
    const missing = ings.filter(i => !have[i.ingredient_id]).map(i => {
      const f = foodById(i.ingredient_id);
      return f ? f.nombre : i.ingredient_id;
    });
    return { recipe: r, coverage: got.length / ings.length, missing: missing };
  }).filter(x => x && x.coverage >= min)
    .sort((a, b) => b.coverage - a.coverage || b.recipe.macros.prot - a.recipe.macros.prot);
}
function consumeFromPantry(recipe) {
  (recipe.ingredients || []).forEach(i => {
    const cur = pantryQty(i.ingredient_id);
    if (cur <= 0) return;
    savePantry({ ingredient_id: i.ingredient_id, estimated_quantity: Math.max(0, cur - i.amount_g) });
  });
}

   Dónde compras cada cosa es una costumbre tuya, no una propiedad

const STORES = ['Mercadona', 'La Sirena', 'Ametller Origen', 'Carrefour', 'Jespac', 'Otro'];

/* De la marca del producto se deduce la tienda por defecto. */
function tiendaPorNombre(f) {
  const n = norm(f.nombre);
  if (/la sirena/.test(n)) return 'La Sirena';
  if (/hacendado/.test(n)) return 'Mercadona';
  if (/ametller/.test(n)) return 'Ametller Origen';
  if (/carrefour/.test(n)) return 'Carrefour';
  if (/alteza|selex|fresc de mercat/.test(n)) return 'Jespac';
  return null;
}
/* Los nombres guardados en el catálogo son abreviados; se normalizan al
   nombre del filtro o los productos desaparecerían de la lista. */
const ALIAS_TIENDA = { 'Ametller': 'Ametller Origen', 'Sirena': 'La Sirena', 'Mercadona': 'Mercadona' };
function normalizaTienda(t) { return t ? (ALIAS_TIENDA[t] || t) : null; }
/* Etiqueta corta para el botón: cortar por el primer espacio convertía
   "La Sirena" en "La". */
const CORTO_TIENDA = { 'Ametller Origen': 'Ametller', 'La Sirena': 'Sirena' };
function shortStore(t) { return CORTO_TIENDA[t] || t; }

function storeOverrides() { return DB.get('tiendas', {}); }
function storeOf(food) {
  if (!food) return null;
  const ov = storeOverrides();
  if (ov[food.id]) return normalizaTienda(ov[food.id]);
  return normalizaTienda(food.tienda || tiendaPorNombre(food)) || null;
}
function setStore(foodId, tienda) {
  const ov = storeOverrides();
  if (!tienda) delete ov[foodId]; else ov[foodId] = tienda;
  DB.set('tiendas', ov);
}

const NUM_PALABRA = {
  un: 1, una: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6,
  siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12,
  media: 0.5, medio: 0.5, par: 2, docena: 12, docenas: 12,
};

/* Cantidad de compra por defecto cuando no se dice ninguna: lo que se
   suele traer del súper de esa cosa, no 100 g. */
function defaultPurchase(f) {
  if (!f) return 500;
  if (f.unit === 'ml') return 1000;
  // Una pizza, no seis; pero de croquetas se compra una bolsa, no una
  if (f.cat === 'Platos') return Math.max(400, f.peso_ud_g || 0);
  if (f.racion_g && f.racion_g <= 10) return 100;     // especias: un bote
  if (f.peso_ud_g) return f.peso_ud_g * 6;
  if (f.kcal100 >= 500) return 250;
  if (f.cat === 'Frutas' || f.cat === 'Verduras') return 750;
  return 500;
}

/* ============================================================
   COSTE ESTIMADO
   Un producto se compra por envases, no por gramos: si necesito
   520 g de algo que viene en botes de 400, pago dos botes. El
   precio solo lo sé de una parte del catálogo, así que la lista
   dice siempre sobre cuántos productos está hecha la cuenta.
   ============================================================ */
function priceOverrides() { return DB.get('precios', {}); }

/* Precio y tamaño de envase: lo que ella haya apuntado manda sobre lo
   que trae el catálogo, que solo cubre parte de los productos. */
function priceOf(f) {
  if (!f) return null;
  const ov = priceOverrides()[f.id];
  const precio = ov && ov.precio != null ? ov.precio : f.precio;
  if (!precio) return null;
  return { precio: precio, env: (ov && ov.env_g) || f.env_g || defaultPurchase(f) };
}
function setPrice(foodId, precio, envG) {
  const ov = priceOverrides();
  if (precio == null) delete ov[foodId];
  else ov[foodId] = { precio: precio, env_g: envG || null };
  DB.set('precios', ov);
}
function packSize(f) {
  const p = priceOf(f);
  return (p && p.env) || (f && f.env_g) || defaultPurchase(f);
}

function lineCost(food, gramos) {
  const p = priceOf(food);
  if (!p) return null;
  const envases = Math.max(1, Math.ceil(gramos / p.env));
  return { envases: envases, euros: envases * p.precio };
}
